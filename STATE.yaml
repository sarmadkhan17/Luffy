      - SDD-STAGE-3-REGISTRY-ATTENTION-SELECTOR is TESTED at 6eb7eb4 as a pure selector component only; 275 affected selector/registry/Attention tests passed
      - the pure deterministic selector accepts an injected immutable RegistrySnapshot
      - the venue-active observation predicate is venue_listing == PRESENT and venue_status == TRADING
      - UNKNOWN, ELIGIBLE and INELIGIBLE account eligibility can all remain observable recorded state; INELIGIBLE is never promoted into trading permission
      - strict Binance USD-M perpetual mapping fails closed
      - only the unambiguous strategy-scan symbol BASE/USDT:USDT establishes existing USD-M coverage; an ambiguous BASE/USDT scan symbol does not suppress a futures observation
      - the explicit snapshot freshness limit is enforced; a future snapshot is refused; a stale snapshot selects nothing and leaves the cursor unchanged
      - canonical lower-bound plus wrap cursor semantics are deterministic; repeated pure calls prevent starvation among selectable non-scan candidates
      - the selection result is immutable and deterministically serialized and hashed
      - the selector has no network, Kernel, journal or persistence dependency
      - SDD-STAGE-3-ATTENTION-SELECTION-PERSISTENCE is TESTED at cda0582 as a durable persistence component only
      - the selection record and cursor_after commit atomically in one SQLite transaction
      - BEGIN IMMEDIATE protects the cursor compare-and-swap across Journal connections; a stale writer is refused with cursor_conflict
      - an exact duplicate selection is idempotent and cannot rewind the cursor; a conflicting duplicate payload is refused
      - stale and nothing-selectable outcomes persist with the cursor unchanged
      - a malformed durable cursor fails closed
      - canonical Selection payload integrity is verified
      - fetch outcomes persist separately and can never change or roll back the cursor
      - Journal remains primitive and does not import observability types
      - the persistence slice introduces no network or Kernel wiring
      - SDD-STAGE-3-LIVE-REGISTRY-PRODUCER is TESTED at 4ee6682 as a read-only producer component only
