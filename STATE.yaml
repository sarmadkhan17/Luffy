  proven_facts:
    - Attention has a correlation_change component.
    - Source is existing captured closed 4h candle history; no new venue request or recorder.
    - 151 closed bars produce 150 log returns.
    - baseline = previous 120 returns (~20 days); recent = latest 30 returns (~5 days); the windows do not overlap.
    - The candidate is excluded from its own reference.
    - One fixed complete peer basket is used across both windows.
    - Reference policy is leave_one_out_equal_weight.
    - The reference is truthfully described as the captured leave-one-out peer basket; it is NOT the crypto market, a market factor, a sector or a BTC proxy.
    - Incomplete peers are excluded entirely rather than joining per-bar.
    - Peer membership/provenance is persisted for deterministic replay.
    - Endpoint correlations r_baseline and r_recent are retained.
    - "Signed feature is the Fisher-scaled change (atanh(r_recent) - atanh(r_baseline)) / sqrt(1/117 + 1/27); Attention salience uses its absolute value."
    - The score is a deterministic heuristic feature, NOT a p-value, significance test, confidence statement or calibrated statistical z-test.
    - No clipping is performed at correlations +/-1; degenerate/saturated evidence fails closed.
    - Equal-magnitude convergence and decoupling receive equal salience.
    - Absence of correlation input preserves legacy behavior.
    - Replay uses persisted captured evidence only.
    - No LLM, trading, Risk or Execution authority was added.
  investigation_family:
    family: correlation_change
    protocol: investigation.correlation_change.v1
    kind: DESCRIPTIVE
    question: "How did this asset's contemporaneous correlation with the same captured peer basket differ between the baseline and recent windows? What captured evidence distinguishes an asset-specific change, a shared cohort change, or an unreliable comparison?"
    results: [relationship_increased, relationship_decreased, relationship_crossed_zero, not_distinct, not_testable]
    rules:
      - Concurrent volume, volatility, relative-return and positioning evidence are context only; their absence does NOT falsify a valid correlation change.
      - Broad cohort movement is context, not contradiction.
      - Baseline/recent relationship sign and magnitude descriptors are retained.
      - Assessment is based only on evidence frozen at registration.
      - This is NOT prospective predictive validation.
      - It grants no bullish/bearish, reversal/continuation, causal or trading conclusion.
    positioning_family: Existing positioning_extreme family semantics, vocabulary, protocol and case ids are unchanged.
