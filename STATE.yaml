completed_repeated_rejection_signal_occurrence_determination:
  id: SDD-STAGE-3-REPEATED-REJECTION-SIGNAL-OCCURRENCE-DETERMINATION-V1
  type: EVIDENCE_AUDIT
  state: COMPLETED_DESIGN_EVIDENCE
  question: Can repeated rejected opportunities now be represented truthfully as repeated rejections of one exact signal occurrence, without inventing a broader multi-bar episode?
  decision: REPEATED_REJECTION_SIGNAL_OCCURRENCE_V1_IMPLEMENTABLE
  evidence_basis: Read-only inspection 2026-09-25 at 230eaa0 of trader/strategy/signal_occurrence.py, trader/strategy/compile.py, trader/core/journal.py (decisions schema, log_decision, update_decision_outcome, reason_codes migration), trader/engine/orchestrator.py (decide, signal cooldown, journalize), trader/kernel.py (scan loop, entry path), and a read-only query of the production /home/sarmad/trader data/luffy.db decisions table. No code, data or policy change.
  findings:
    per_scan_persistence: Every scanned symbol logs one decision row per scan (HOLD included) through journalize -> log_decision, and signals_json persists every fired StrategySignal with its params; so each scan that observed an occurrence carries its key and can be joined on it exactly.
    derivable_per_occurrence:
      - number of decision rows (scans) whose signals_json carries the key
      - executed flag of each such row (final value after update_decision_outcome / recovery overwrite)
      - ordered (ts, decision_id, scan_id, decision action, executed, reason_codes) history
      - whether any observing decision was executed
      - first and last observing decision ts
    decision_level_attribution: reason_codes and executed belong to the decision, not the signal. A row may carry several signals (several specs, or opposing directions), and decision action may differ from the occurrence action (strategy gate, cooldown). The truthful statement is "a decision carrying this occurrence was refused with codes X", not "this signal caused refusal X".
    uncoded_non_execution: >-
      Not every non-executed observing row is a coded refusal. The orchestrator
      signal cooldown rewrites a directional decision to HOLD with no
      skip_reason text and no code (control event only); below-threshold HOLDs
      and zero-lot/submission failures also carry '[]'. Production evidence:
      6 of the 7 signal-bearing decisions in the last 3 days are HOLD with
      empty skip_reason while their signal is BUY. These rows must be counted
      separately as uncoded non-executions, never as coded rejections and
      never as success ([] is not success; NULL is not recorded).
    repetition_is_scan_cadence: scan_interval_seconds 60 re-observes one closed 4h signal bar up to about 240 times, so the per-occurrence scan count and refusal count are driven by scan cadence and signal-bar length, not by independent evidence. A count is descriptive only; it is not an opportunity count and does not by itself justify a firing threshold or salience.
    runtime_data: Production journal is pre-deployment (no reason_codes column, 0 rows with occurrence fields), so V1 is validated on synthetic journal fixtures; no empirical per-occurrence distribution exists yet.
  rejected_alternatives:
    - grouping consecutive signal bars - multi-bar episode semantics remain UNDETERMINED
    - counting occurrences as independent opportunities - SIGNAL_OCCURRENCE_IS_NOT_OPPORTUNITY_EPISODE
    - treating executed=0 as rejected - conflates coded refusals with uncoded non-execution
    - count-threshold Attention trigger or salience - no justified threshold/magnitude; counts are scan-cadence artifacts
  selected_next_capability: SDD-STAGE-3-REPEATED-REJECTION-SIGNAL-OCCURRENCE-OBSERVATION-V1
  selection_reasoning:
    - The key and codes are both persisted in the same decision row, so the observation is a pure deterministic read over existing journal rows - no new store, column, time window or interpretation.
    - It makes repeated refusals of one exact signal visible to the owner and to later Attention work without pseudo-replicating them into opportunity counts.
  not_queued: The repeated-rejected-opportunity Attention trigger (firing predicate, salience, dedup) remains MISSING; multi-bar rejection-episode semantics remain UNDETERMINED.
  maturity_boundary: Determination and selection only; no implementation, trigger, ranking change or maturity upgrade. Attention overall remains IMPLEMENTED.

