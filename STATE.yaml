completed_attention_gap_priority_audit:
  id: SDD-STAGE-3-ATTENTION-GAP-PRIORITY-AUDIT
  type: EVIDENCE_AUDIT
  state: COMPLETED_DESIGN_EVIDENCE
  finding: ATTENTION-PORTFOLIO-SIGNALS
  evidence:
    - SDD.md v3.2 Stage 3 Attention requirements
    - SDD-STAGE-3-ATTENTION-KERNEL-WIRING TESTED at d3c1f29
    - trader/kernel.py
    - trader/observability/attention.py
    - trader/cognition/attention.py
  requirement_status:
    registry_backed_venue_observation: TESTED_OPT_IN_OFF_BY_DEFAULT
    fairness_starvation: PARTIAL
    live_world_model_input: PARTIAL
    portfolio_state_input: PARTIAL_PREREQUISITE_ESTABLISHED
    research_investigation_feedback: MISSING
    urgency: MISSING
    per_candidate_research_cost: MISSING
    event_driven_invocation: PARTIAL
    replay_provenance: PARTIAL
    broader_sdd_trigger_classes: MISSING_OR_BLOCKED_BY_UPSTREAM
  findings:
    - Registry-backed venue observation is live and tested when enabled, but remains opt-in and off by default; one supplemental slot and deterministic rotation do not establish broader fairness or starvation freedom at the live population level.
    - The Attention evaluator accepts an exact-cut WorldModel input, but the live Kernel supplies no WorldModel.
    - Detached portfolio-position capture is now TESTED, but its input to live Attention priority remains PARTIAL / prerequisite-established; research/investigation feedback, urgency and per-candidate research cost remain missing.
    - Event-driven invocation and material-change gating are partial; the broader SDD trigger classes remain missing or upstream-blocked, including regime transition, correlation breakdown, positioning extremes, liquidity change, strategy degradation, unexplained portfolio loss, repeated rejections, WorldModel contradiction, external research claim, owner question and new-data availability.
    - Selection and fetch records retain provenance, but durable RegistrySnapshot history is absent; full historical registry replay remains unavailable.
  dependency_conclusion:
    - The existing Kernel position source is read later than the Attention capture cut; it is now detached as point-in-time evidence, but has no Attention consumer or proven portfolio salience signal.
    - Unexplained portfolio-loss and portfolio-impact triggers depend on portfolio-state context; neither trigger is implemented by this selection.
    - Live WorldModel contradiction and regime triggers remain blocked by the missing live Kernel WorldModel producer.
    - Full historical registry replay depends on durable RegistrySnapshot history.
  maturity_boundary: Attention overall remains IMPLEMENTED; this audit adds design evidence only.

