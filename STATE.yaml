      - only the unambiguous strategy-scan symbol BASE/USDT:USDT establishes existing USD-M coverage; an ambiguous BASE/USDT scan symbol does not suppress a futures observation
      - the explicit snapshot freshness limit is enforced; a future snapshot is refused; a stale snapshot selects nothing and leaves the cursor unchanged
      - canonical lower-bound plus wrap cursor semantics are deterministic; repeated pure calls prevent starvation among selectable non-scan candidates
      - the selection result is immutable and deterministically serialized and hashed
      - the selector has no network, Kernel, journal or persistence dependency
      - SDD-STAGE-3-ATTENTION-SELECTION-PERSISTENCE is TESTED at cda0582 as a durable persistence component only
      - the selection record and cursor_after commit atomically in one SQLite transaction
      - BEGIN IMMEDIATE protects the cursor compare-and-swap across Journal connections; a stale writer is refused with cursor_conflict
      - an exact duplicate selection is idempotent and cannot rewind the cursor; a conflicting duplicate payload is refused
      - stale and nothing-selectable outcomes persist with the cursor unchanged
      - a malformed durable cursor fails closed
      - canonical Selection payload integrity is verified
      - fetch outcomes persist separately and can never change or roll back the cursor
      - Journal remains primitive and does not import observability types
      - the persistence slice introduces no network or Kernel wiring
      - SDD-STAGE-3-LIVE-REGISTRY-PRODUCER is TESTED at 4ee6682 as a read-only producer component only
      - a dedicated read-only Binance USD-M registry provider exists; its only source is public /fapi/v1/exchangeInfo
      - the provider is separate from DataFeed, Universe, Risk, Execution and Kernel
      - production/demo target host and environment are explicit and validated
      - RegistrySnapshot.as_of_ms equals the local full-response receipt time; exchange serverTime is provenance only and never substitutes for the local cut
      - raw response SHA-256, byte count, host, endpoint, timings, HTTP status and outcome are retained
      - account-global trading and per-symbol permission metadata remain UNKNOWN
      - a failed first refresh produces no snapshot; a failed later refresh keeps the exact previous snapshot, snapshot_id and as_of
      - a new snapshot is published only after complete translation succeeds
      - the provider component uses no trading credentials, account or order endpoints and remains separate from Kernel internals
      - SDD-STAGE-3-ATTENTION-KERNEL-WIRING is TESTED at d3c1f29; registry-backed selection is wired into the live Kernel path but remains off by default in config
      - one explicit supplemental mode is off, manual or registry; absent mode means manual with supplemental_symbol and off otherwise
      - registry/manual conflict disables supplemental observation only; trading continues
      - registry automatic mode is FUTURES-only and observes explicitly configured production Binance USD-M, independently of trading venue and without trading permission
      - a dedicated background single-flight thread refreshes the registry; the cycle reads only the latest immutable RegistrySnapshot
      - four-hour refresh, 300-second retry and eight-hour maximum snapshot age are implementation policies, not SDD constants
      - no snapshot means no selector, selection persistence or fetch; stale snapshot is durably recorded without cursor movement or fetch; fresh last-good snapshot survives a later refresh failure
      - Kernel translates known FUTURES scan spelling BASE/USDT to BASE/USDT:USDT only at the selector boundary; _scan_symbols() is unchanged and an existing scan member is not selected again
      - live order is snapshot, durable cursor, selector, atomic selection/cursor commit, supplemental fetch, fetch-outcome commit, Attention capture
      - selection persistence failure prevents fetch; fetch-outcome persistence failure prevents Attention capture; failed fetch consumes the persisted rotation slot
      - durable fetch reason is tokenized while exact runtime and capture reason is retained
      - capture provenance links snapshot_id to selection_id to supplemental result to Attention scan; manual and legacy capture have no registry provenance
      - trading scan, Orchestrator, Risk and Execution behavior is unchanged
      - Attention code provenance and hash include the registry producer, selector, persistence and semantic dependencies
      - SDD-STAGE-3-ATTENTION-PORTFOLIO-OBSERVATION-PREREQUISITE is TESTED at 285b0ce as capture-only evidence; it is not consumed by Attention
      - SDD-STAGE-3-ATTENTION-CORRELATION-CHANGE-V1 is TESTED at e61fb82 (correlation_change component vs the captured leave-one-out peer basket); a deterministic heuristic feature, not a significance test; predictive usefulness NOT_ESTABLISHED; not deployed
    gaps:
      - live Kernel does not currently supply a WorldModel to Attention; the tested evaluator input is a seam, not live production input
      - venue-active instruments with account_eligibility=UNKNOWN may be observed by Attention without implying trade permission; registry, Attention, trading, Risk and Execution authority remain separate (trader/core/instrument_registry.py; trader/observability/attention.py)
      - the 2-second timeout is an implementation choice, not an SDD constant
      - pathological OS uninterruptible-process states cannot guarantee both finite cleanup and confirmed reaping
      - automatic registry mode is implemented but off by default in config
      - the existing 30-second SQLite busy-lock exposure remains a broader pre-existing Journal/live-loop limitation; Kernel wiring does not claim to solve global Journal latency
      - provider DNS can still hang the background refresh thread
      - retained boot CCXT metadata lacks adequate observation-time/provenance truth and must not be re-stamped as a fresh snapshot
      - durable RegistrySnapshot historical store is not established; historical registry replay is not claimed - selection and fetch records remain traceable by IDs, but historical registry contents cannot be reconstructed and body hash/provenance cannot be guaranteed after provider/log rotation
