completed_rejection_episode_identity_determination:
  id: SDD-STAGE-3-REJECTION-EPISODE-IDENTITY-DETERMINATION-V1
  type: EVIDENCE_AUDIT
  state: COMPLETED_DESIGN_EVIDENCE
  question: Can LUFFY now define a truthful repeated-rejected-opportunity episode from existing persisted decision identity, symbol, direction, reason_codes and time without inventing grouping semantics?
  decision: REJECTION_EPISODE_IDENTITY_MISSING
  evidence_basis: Read-only inspection 2026-09-25 at cccfbd8 of trader/core/journal.py (decisions schema, migrations, log_decision), trader/core/types.py (Decision, StrategySignal), trader/engine/orchestrator.py (Decision construction), trader/strategy/compile.py (compiled spec evaluator), trader/kernel.py (scan_id), trader/cognition/hypotheses.py and trader/cognition/replay.py, config.yaml scan interval. No code, data or policy change.
  findings:
    decision_id: new_id("dec") - random per decision; identifies one row, never a cross-decision opportunity.
    cycle_id_and_scan_id: Per-cycle / per-Attention-scan identities; one per scan, so they separate repeated decisions rather than join them.
    strategy_ids_and_signals_json: Persist which spec fired (spec_id), direction (action) and params {spec_id, signal_bar_age_min}. signal_bar_age_min is wall-clock age rounded to 0.1 min at evaluation, not an identity; reconstructing the bar from ts minus age would be inference.
    signal_bar_close_ms: Computed inside the compiled spec evaluator (closed_at in trader/strategy/compile.py) and then discarded; not persisted. Legacy library.py signals carry no bar identity at all.
    cognition_episode_ids: hypotheses.py episode_id = stable_id("ep", decision_id, sym) is per decision; replay.py open_episodes groups by symbol with a horizon deadline in offline replay. Neither is persisted with journal decisions, and the replay deadline is a research-horizon construct, not an opportunity identity.
    outcomes: Keyed by decision_id; one per directional decision; no grouping key.
    repetition_mechanism: scan_interval_seconds 60 re-evaluates the same closed signal bar many times per strategy timeframe, so repeated refusals of one setup are pseudo-replicates of one signal, not independent opportunities.
  rejected_groupings:
    - same symbol - not the same opportunity
    - same reason code - not the same opportunity
    - nearby timestamps or any time window - would invent grouping semantics
    - (symbol, direction, spec_id) alone - cannot separate a re-fire on a new bar from a repeat of the same bar
  exact_missing_identity: >-
    A persisted, deterministic signal-occurrence identity per strategy signal -
    the exact signal-bar close time (ms) and the spec timeframe it was computed
    on, recorded at the branch where the compiled spec signal fires - giving the
    key (spec_id, symbol, action, spec timeframe, signal_bar_close_ms). Repeated
    decisions carrying the same key are the same signal occurrence re-evaluated.
  identity_semantics_boundary:
    - The key identifies one signal occurrence (one closed signal bar), not a multi-bar setup; consecutive bars on which a level condition stays true are distinct occurrences and are not merged in V1.
    - Decisions without a keyed signal (legacy library signals, strategy_no_signal HOLDs) are not episode-eligible; they are not assigned a synthetic key.
    - Legacy rows stay without identity; no reconstruction from signal_bar_age_min or ts.
  selected_next_capability: SDD-STAGE-3-STRATEGY-SIGNAL-OCCURRENCE-IDENTITY-V1
  selection_reasoning:
    - It is the single missing identity; the value is already computed at the firing branch and only needs persisting, so it is a small, deterministic, additive receipt with no time window and no semantic interpretation.
    - It is independently useful beyond the trigger - it makes live signal-age/execution-delay evidence exact (backtest fills at the signal bar close) and removes pseudo-replication in any decision/outcome evaluation (one decision counted many times).
    - No venue request, LLM, recorder, retention policy or new store; no audit chain.
  not_queued: The repeated-rejected-opportunity trigger remains MISSING (needs this identity, then a separately justified salience policy).
  maturity_boundary: Determination and selection only; no implementation, trigger, ranking change or maturity upgrade. Attention overall remains IMPLEMENTED.

