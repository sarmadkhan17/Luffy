      - timeout or failure is telemetry-only and does not stop trading
      - the parent validates response identity and schema, row count, numeric values, closed bars and the Attention window
      - usable supplemental data reaches Attention capture only; the symbol remains outside the trading scan, strategy frames, Orchestrator, Risk and Execution
