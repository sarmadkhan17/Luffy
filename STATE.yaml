progress_method:
  rule: Progress is acceptance-evidence based, not code-volume based.
  maturity_states: [DEFINED, IMPLEMENTED, TESTED, SHADOW, PROVEN, ACTIVE, DEGRADED, RETIRED]
  evidence_rule: Every state claim must cite current repository code/tests/artifacts or be marked UNKNOWN/MISSING.
  scoring_rule: No percentage progress scores are authoritative.

