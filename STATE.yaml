forced_liquidation_prerequisite_audit:
  audited_at: '2026-09-24'
  audit_head: 4c63e82d511d9acd9228d7481e51366df4e9c527
  dependency_order: Define transport evidence semantics now; qualify durable absolute-UTC clock receipts first; complete production coverage policy only after clock and transport bounds are justified.
  rationale: Coverage and clock health are independent necessary gates; coverage status precedence is not dependency order. Clock receipts need no liquidation stream and can establish the missing UTC basis before coverage-policy completion.
  coverage_policy:
    verified_documentation: 'https://developers.binance.com/en/docs/products/derivatives-trading-usds-futures/websocket-market-streams/Connect'
    documented_facts: Binance specifies 24-hour sessions, server ping every 3 minutes and disconnection without a pong within 10 minutes; these are transport rules, not admissible coverage-gap bounds.
    inspected_runtime: /home/sarmad/trader/venv/bin/python; Python 3.12.3 (main, Aug 31 2026, 10:18:26) [GCC 13.3.0]; websockets 17.0.1; installed defaults verified by signature/source inspection, not by a production connection.
    defaults: Client ping interval/timeout 20s/20s; open/close timeout 10s/10s; max_size 1048576 bytes; max_queue 16 frames; write_limit 32768 bytes; compression deflate; proxy auto-detection enabled.
    reconnect: Library retry backoff starts uniformly in [0,5) seconds, then 3.1 seconds multiplied by 1.618 up to 90 seconds for retryable connection failures. Recorder sessions are sequential; no proactive overlapping rollover is implemented.
    durable_evidence: Session settings/dependency versions, ping payload before send, received pong payload/match flag, server ping, handshake and failure records are archived. Server-pong transmission has no separate durable receipt; a ping intent alone proves no round trip.
    freezable_semantics: Require same-session matched ping/pong evidence, boundary brackets, verified interval union, durable complete logs and seal; no socket-open or reconnect-success substitute. Replay can merge overlapping fixture intervals, but does not establish production rollover overlap.
    failure_behavior: Synchronous persistence failure stops recording; frame-too-large records DROP; reader errors and missing end evidence fail closed. No REST gap backfill; no proof of upstream publisher completeness.
    unresolved_bounds: Maximum permitted liveness gap, planned rollover overlap and clock-offset-drift tolerance are UNKNOWN; defaults, venue disconnect limits and fixture values cannot justify them.
    smallest_transport_evidence_prerequisite: Design a bounded diagnostic measurement protocol for matched-pong intervals/RTT, scheduling and durable-write delay, reconnect/handshake latency and rollover continuity; declare selection, duration and failure reporting before a separately authorized run. Observed maxima alone are not guaranteed bounds.
    freeze_boundary: Facts and predicates above are recordable now; production numeric policy and pre-window archived documentation/hash remain unfrozen. No diagnostic or liquidation collection is queued here.
  clock_health:
    inspection: Read-only timedatectl show/timesync-status/show-timesync, service status, VMware timesync status, service journal and adjtimex(modes=0); no clock or service changes.
    available: systemd 255.4-1ubuntu8.17; systemd-timesyncd active; NTP=yes and NTPSynchronized=yes; ntp.ubuntu.com; chrony/ntp/ntpsec inactive and chronyc/ntpq/adjtimex CLIs unavailable.
    snapshot_only: Reported root distance 3.692ms, offset +8.910ms, delay 127.392ms, jitter 20.607ms and polling 2048s. RootDistanceMaxUSec=5s is daemon configuration, not a window uncertainty bound.
    kernel_snapshot_only: Read-only adjtimex returned TIME_OK (0), status 8193, maxerror 974500us, esterror 0; these mutable instantaneous estimates are not a durable window certificate.
    virtualization: VMware with vmtoolsd; periodic VMware timesync reports Disabled; clocksource tsc. No hypervisor UTC-health receipt or resume/step uncertainty bound established.
    existing_receipt: NOT_ESTABLISHED; repository search finds a ClockHealthEvidence envelope and fixture receipts, but no production clock-health producer/verifier. Daemon journal startup/contact events do not cover registered windows.
    rejected_shortcuts: Signed recvWindow, successful HTTPS, stable monotonic/UTC offset, NTP synchronized flag or zero esterror alone cannot prove absolute UTC accuracy.
    smallest_prerequisite: Qualify existing timesyncd plus kernel telemetry as a candidate source; define an immutable receipt and independent verifier deriving conservative UTC uncertainty over a declared interval, or return source-insufficient with exact missing evidence.
    receipt_requirements: Bind raw source measurements/hash, source trust/provenance and versions, host/boot identity, UTC/monotonic/boottime samples, sampling uncertainty, freshness/holdover derivation and interval endpoints; reject missing evidence, unsync, steps, suspend/resume, reboot, tampering and unsupported extrapolation.
    boundary: No trustworthy whole-window source is established by this audit. Absolute uncertainty and relative offset-drift tolerance need justified source semantics and observations; no numeric tolerance is invented.

completed_clock_health_receipt_design:
  id: SDD-CLOCK-HEALTH-RECEIPT-V1
  status: COMPLETED_DESIGN_EVIDENCE
  result: CLOCK_SOURCE_INSUFFICIENT
  evidence_basis: Completed read-only audit findings supplied by the owner for reconciliation at HEAD 4bae7c5; no new host audit or collection performed.
  established_findings:
    - Existing systemd-timesyncd, timedatectl, kernel adjtimex/timex, VMware state and local clock relationships provide synchronization/relative diagnostics but do not establish a durable finite bound on absolute UTC error across a registered interval.
    - NTPSynchronized=yes is not an absolute-error certificate.
    - Root distance, jitter, maxerror/esterror and stable realtime-minus-monotonic relationships cannot independently establish true UTC.
    - Current repository has no production absolute-clock producer/verifier.
    - Snapshots cannot retrospectively certify an entire historical window.
    - Suspend/resume, clock step, reboot, VM pause/restore/migration and source loss require explicit continuity/requalification handling.
    - A valid whole-window receipt requires externally anchored UTC accuracy with justified trust/network/timestamp assumptions and justified uncertainty propagation/holdover across the interval.
    - Hashes prove integrity, not UTC correctness.
    - Today a receipt may truthfully record unqualified with uncertainty=null, but cannot populate production-valid ClockHealthEvidence.
  candidate_collection_seam:
    status: NECESSARY_NOT_SUFFICIENT
    evidence: Prospective timesyncd D-Bus updates; bracketed realtime/monotonic/boottime/raw readings; adjtimex snapshots; timerfd TFD_TIMER_CANCEL_ON_SET; boot/suspend evidence.
    boundary: No implementation queued until source/trust and propagation contracts support a finite bound.
  decision: EXTERNAL_GUARANTEE_REQUIRED
  decision_basis: The audited existing NTP/VM environment has no established defensible source-accuracy envelope or propagation guarantee. These require documented, independently verifiable evidence; no Ubuntu NTP pool accuracy bound or ppm/error limit is assumed. Whether an alternate source is required remains for the source-contract design.
  boundary: Design evidence only; RECORDER_TESTED_PRODUCTION_COVERAGE_BLOCKED remains; both production policy globals remain None.

completed_clock_health_source_contract_design:
  id: SDD-CLOCK-HEALTH-SOURCE-CONTRACT-V1
  status: COMPLETED_DESIGN_EVIDENCE
  decision: EXTERNAL_GUARANTEE_REQUIRED
  evidence_basis: Completed audit findings supplied by the owner for reconciliation at HEAD 5f0c09b; no new authoritative-source review, host audit or collection performed.
  established_findings:
    - Existing NTP can mathematically produce a conservative offset interval without assuming symmetric network delay, conditional on trustworthy server UTC accuracy, timestamp/error semantics and continuity assumptions.
    - Existing environment does not establish an authoritative source UTC-accuracy envelope, a finite local clock-rate/holdover bound or rollback-resistant VM lifecycle continuity.
    - Existing NTP is not rejected.
    - ALTERNATE_CLOCK_SOURCE_REQUIRED is not established yet.
    - Chrony/NTS/PTP/PHC do not automatically solve all three missing guarantees.
    - NTS authenticates source/messages but does not itself certify UTC accuracy.
    - Local clocks and diagnostics remain supporting evidence only.
  missing_external_contracts:
    source_utc_accuracy:
      evidence_required: Authoritative evidence covering the exact NTP service/source.
      guarantees:
        - Exact NTP service/source trust.
        - UTC traceability/accuracy envelope.
        - Upstream dispersion/holdover semantics.
        - Timestamp error bounds.
        - Leap/smear behavior.
        - Failure signaling.
    vm_clock_propagation:
      evidence_required: Authoritative evidence covering the actual VMware virtual clock.
      guarantees:
        - Actual virtual clock rate-error bound.
        - Discipline/slew interaction.
        - Elapsed-time uncertainty growth.
        - Supported holdover duration.
        - Source-loss behavior.
    lifecycle_continuity:
      evidence_required: Externally maintained evidence covering VMware lifecycle continuity.
      guarantees:
        - Pause/stun.
        - Suspend/resume.
        - Snapshot restore.
        - Migration.
        - Startup corrections.
        - Rollback-resistant generation/continuity state.
  boundary: Design evidence only; RECORDER_TESTED_PRODUCTION_COVERAGE_BLOCKED remains; PRODUCTION_POLICY and PRODUCTION_CLOCK_HEALTH_POLICY remain null.

