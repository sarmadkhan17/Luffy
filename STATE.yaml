completed_attention_salience_scale_audit:
  id: SDD-STAGE-3-ATTENTION-SALIENCE-SCALE-AUDIT
  type: EVIDENCE_AUDIT
  state: COMPLETED_DESIGN_EVIDENCE
  result: NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET
  evidence:
    - LUFFY_Official_Solution_Design_v3.md section 8
    - trader/cognition/attention.py
    - trader/observability/attention.py
    - trader/observability/portfolio_observation.py
    - trader/observability/store.py
    - trader/kernel.py
  findings:
    - Current candle Attention components are z-like magnitudes; the optional WorldModel component also requires z_score evidence.
    - The evaluator takes the maximum absolute available component magnitude, ranks the resulting scalar salience, and selects subject to min_salience.
    - Components competing directly in this scalar maximum therefore require comparable magnitude semantics.
    - Boolean portfolio_position_present has no justified conversion to that scale today; assigning an arbitrary number would invent ranking policy.
    - No existing calibrated position-presence mapping or sufficient paired historical Attention plus detached PortfolioObservation dataset was found in this checkout.
    - SDD permits normalized priority dimensions and calibrated weights but supplies no boolean-to-z conversion.
    - Typed multi-axis Attention may be architecturally compatible but requires a separate design decision.
    - Portfolio presence can remain captured evidence without ranking effect.
  target_boundary: TARGET_PREREQUISITE_REQUIRED; neither future return nor the existing five-bar market-path outcome is established as investigation usefulness.
  portfolio_state_input: PARTIAL_PREREQUISITE_ESTABLISHED
  maturity_boundary: Attention overall remains IMPLEMENTED; portfolio salience is not IMPLEMENTED; this audit adds design evidence only.

