project: LUFFY
sdd_version: '3.2'

work_package:
  id: SDD-STAGE-3-ATTENTION-LIVE-SELECTION-DEPENDENCY-AUDIT
  type: DEPENDENCY_AUDIT
  priority: ACTIVE
  status: READY

  objective: >
    Determine the correct implementation order among live RegistrySnapshot
    production, durable selection/cursor persistence and Kernel selector
    integration. Audit only.

  working_rule: "locked = don't redesign; implemented = verify; discuss only gaps"

  completed_prerequisite:
    - SDD-STAGE-3-REGISTRY-ATTENTION-SELECTOR is TESTED at 6eb7eb4 (trader/observability/registry_selector.py; tests/test_registry_attention_selector.py); 275 affected selector/registry/Attention tests passed.
    - The selector is a pure component over an injected immutable RegistrySnapshot with an explicit max_snapshot_age_ms input and caller-held cursor; it has no network, Kernel, journal or persistence dependency.
    - Bounded isolated supplemental Attention data path is TESTED at 9b95d4f and remains the only data path for a selected symbol.
    - Attention overall remains IMPLEMENTED; automatic Attention selection is not active in production.

  open_gaps:
    - no live RegistrySnapshot producer or refresh
    - no Kernel selector wiring
    - no durable cursor and selection-record transaction
    - no durable RegistrySnapshot historical store
    - no live max_snapshot_age_ms config wiring

  locked_integration_decisions:
    - From the closed selector design - live integration must add one durable transaction writing the selection record and cursor before the network attempt; the live caller advances to cursor_after after the selection attempt even if the later fetch fails. The audit verifies feasibility and ordering; it does not redesign this.

  audit_questions:
    - q1: What exact live data already available in Kernel, DataFeed or account setup can construct the tested RegistrySnapshot without inventing facts?
    - q2: Can a live snapshot be produced read-only from already-loaded exchange/account metadata, or would new API calls be required?
    - q3: Where should snapshot ownership live?
    - q4: What cut and as_of semantics can be guaranteed?
    - q5: What refresh cadence is justified?
    - q6: What should happen if registry refresh fails or becomes stale?
    - q7: Does durable cursor persistence need to exist before Kernel can safely call the selector?
    - q8: Can Kernel integration be tested first with an injected snapshot and cursor without claiming production activation?
    - q9: What exact atomicity is required between the selection record, cursor advance and supplemental fetch attempt?
    - q10: Which dependency should be implemented next?

  decision_options:
    A: LIVE-REGISTRY-PRODUCER
    B: SELECTION-PERSISTENCE
    C: KERNEL-INJECTION-SEAM
    D: POLICY_BLOCKED

  required_output:
    - Answer q1-q9 with file/line evidence from current repository code; mark anything not established as UNKNOWN or MISSING rather than assuming it.
    - Choose exactly one smallest next slice from decision_options with rationale and its dependency ordering relative to the other two.
    - For the chosen slice, state its contract, required tests and do_not_implement boundaries so it can be queued as the next IMPLEMENTATION package.

  audit_inputs:
    - SDD.md
    - trader/core/instrument_registry.py
    - trader/data/binance_usdm_registry.py
    - trader/observability/registry_selector.py
    - trader/observability/supplemental.py
    - trader/observability/attention.py
    - trader/cognition/attention.py
    - trader/kernel.py
    - trader/data/feed.py
    - trader/core/journal.py

  do_not_implement:
    - any code, Kernel wiring, live RegistrySnapshot producer or refresh, config wiring or persistence
    - trading eligibility, Universe, strategy scan, Risk or Execution changes
    - new exchange API calls made during the audit
    - broader Attention fairness policy beyond the one rotating supplemental slot

  constraints:
    - "locked = don't redesign; implemented = verify; discuss only gaps"
    - Audit only; the tested selector contract is locked.
    - Preserve SDD v3.2 as architecture authority and keep trading and execution eligibility unchanged.
    - Do not promote Attention overall beyond its current maturity.
    - Preserve the completed Scheme-D bounded pilot as parked, non-final evidence.
    - Do not run another pilot, additional RNG benchmark, full validation, or cloud compute without separate explicit owner authorization.
    - Do not alter frozen research or pilot artifacts.

