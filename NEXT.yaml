work_package:
  id: SDD-STAGE-3-ATTENTION-PORTFOLIO-SIGNALS
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: >
    Feed the TESTED detached portfolio-position observation into Attention as a
    bounded, direction-independent salience input without changing any trading authority.
  completed_prerequisite:
    - SDD-STAGE-3-ATTENTION-KERNEL-WIRING is TESTED at d3c1f29; registry observation is live when enabled but off by default.
    - SDD-STAGE-3-ATTENTION-GAP-PRIORITY-AUDIT is COMPLETED_DESIGN_EVIDENCE in STATE.yaml with finding ATTENTION-PORTFOLIO-SIGNALS.
    - SDD-STAGE-3-ATTENTION-PORTFOLIO-SOURCE-AUDIT is historical design evidence; its source prerequisite is now established.
    - SDD-STAGE-3-ATTENTION-PORTFOLIO-OBSERVATION-PREREQUISITE is TESTED at 285b0ce in trader/observability/portfolio_observation.py, trader/kernel.py and tests/test_portfolio_observation.py; capture is not consumed by Attention yet.
  first_task: Add an optional, bounded portfolio_position_present salience component for an explicit validated open PositionRecord at the Attention cut.
  likely_files:
    - trader/cognition/attention.py
    - trader/observability/attention.py
    - trader/kernel.py
    - trader/observability/portfolio_observation.py
    - focused Attention and Kernel tests
  first_signal_scope:
    preferred_component: portfolio_position_present
    rules:
      - Use only verified current-position presence from an explicit PositionRecord; the contribution is a bounded salience boost with no BUY/SELL direction.
      - Use absolute quantity only if normalization across instruments can be justified without inventing cross-symbol comparability.
      - Do not use a record absent from the observation as salience unless complete and safe absence semantics are proven for that exact instrument.
  timing:
    - The evaluator receives an explicit attention_as_of_ms cut and an explicit freshness input or configuration policy; do not invent a hardcoded freshness constant.
    - Future and stale observations contribute nothing; accepted evidence requires observation.as_of_ms <= attention_as_of_ms.
    - Never silently re-stamp retained observation evidence.
  identity:
    - Join only exact canonical instrument identity to the Attention instrument; never strip a bare symbol suffix as identity proof.
    - If the evaluator lacks venue/market identity, define the smallest explicit mapping seam and fail closed on ambiguity.
  behavior:
    - Portfolio input is optional; absent context preserves existing Attention output exactly, including candle and WorldModel behavior.
    - Validated presence can only increase salience; it does not set direction, allocation, sizing, Risk permission, strategy eligibility or registry population.
    - Trading scan, Orchestrator, Risk and Execution remain unchanged.
  telemetry_provenance:
    - Retain portfolio observation_id, as_of_ms, environment, source_ref and matched canonical instrument ID.
    - Record whether presence contributed, its contribution value and the reason when portfolio evidence contributes nothing.
    - Expose the contribution in selected and ranked reasons; claim no full historical replay beyond retained captured evidence.
  required_tests:
    - No portfolio observation leaves legacy Attention result identical.
    - Valid exact-cut position record can contribute bounded salience.
    - Long and short position presence contribute identically; there is no direction output.
    - Future and stale observations contribute nothing.
    - Ambiguous identity and unmatched instruments contribute nothing.
    - Malformed or missing evidence never fabricates a signal.
    - Position-presence contribution is deterministic.
    - Selected and ranked reasons expose portfolio contribution.
    - Portfolio evidence does not alter trading scan or strategy eligibility.
    - Orchestrator, Risk and Execution behavior is unchanged.
    - Capture retains portfolio provenance.
    - Existing candle and WorldModel behavior is unchanged when portfolio input is absent.
  constraints:
    - Defer absence-as-flat unless separately proven, absolute notional/exposure, concentration, unrealized P&L, portfolio loss trigger, urgency, research feedback, portfolio optimization/rebalancing, equity/drawdown, WorldModel live producer and Scheme-D work.
    - Do not claim gross/net exposure or hedge state from the position observation.
    - Preserve Attention overall maturity IMPLEMENTED and the parked non-final Scheme-D pilot; no new pilot, full validation, cloud or RNG work.

