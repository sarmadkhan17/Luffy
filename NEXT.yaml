work_package:
  id: SDD-STAGE-3-STRATEGY-SIGNAL-OCCURRENCE-IDENTITY-V1
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: Persist a deterministic signal-occurrence identity with each compiled strategy signal - the spec timeframe and the exact close time (ms) of the closed signal bar the signal fired on - so repeated decisions on the same signal occurrence share an exact key.
  basis:
    - SDD-STAGE-3-REJECTION-EPISODE-IDENTITY-DETERMINATION-V1 - REJECTION_EPISODE_IDENTITY_MISSING.
    - decision_id is random per row; cycle_id/scan_id are per scan; signals_json carries only spec_id and a rounded wall-clock signal_bar_age_min.
    - The compiled spec evaluator already computes the signal-bar close time (closed_at in trader/strategy/compile.py) and discards it.
    - SDD-STAGE-3-DECISION-REJECTION-REASON-CODES-V1 TESTED at cccfbd8 supplies the refusal codes; episode identity is the remaining missing source for SDD 8.1 repeated rejected opportunities.
  source:
    - trader/strategy/compile.py compiled spec evaluator - the branch where BUY/SELL is returned and closed_at is computed.
    - No venue request, LLM call, DataFeed change, recorder or new store.
  missing_transformation:
    - Record signal_timeframe and signal_bar_close_ms (integer ms, exact, from the same closed bar the entry series was evaluated on) in StrategySignal.params, persisted through the existing decisions.signals_json.
    - Define signal-occurrence key (spec_id, symbol, action, signal_timeframe, signal_bar_close_ms) as a pure function over a persisted signal; no journal column required unless a test shows signals_json cannot carry it.
  frozen_semantics:
    - The key identifies one signal occurrence (one closed signal bar), not a multi-bar setup; consecutive bars on which the condition stays true are distinct occurrences.
    - If the bar time cannot be determined exactly, the fields are null (not recorded) and the signal has no key; never a fabricated or approximated value.
    - Legacy library.py signals, HOLDs without a signal and legacy rows carry no key; no reconstruction from ts or signal_bar_age_min.
    - signal_bar_age_min is retained unchanged.
  implementation_boundary:
    - trader/strategy/compile.py - add the two params at the firing branch.
    - A small pure helper for the occurrence key (location chosen next to existing signal/decision helpers).
  acceptance_tests:
    - tests/test_strategy_signal_occurrence_identity.py (new) - fired signals carry exact signal_bar_close_ms equal to the evaluated closed bar close for the spec timeframe; repeated evaluations of the same closed bar yield the same key; a new closed bar yields a different key; BUY/SELL and different spec_ids yield different keys; undeterminable bar time yields null fields and no key; signals_json round-trip preserves the fields; action, confidence, rationale, spec_id and signal_bar_age_min unchanged; no key for legacy/no-signal decisions.
    - Existing compile/spec evaluator, orchestrator and tests/test_decision_rejection_reason_codes.py pass apart from recorded baseline failures.
    - scripts/backtest_equivalence.py PASS is unaffected (no backtest-engine change).
    - git diff --check clean.
  preserve:
    - Trading decisions, signals' direction, sizing, Risk limits, Execution, protective stops, control state, skip_reason and reason_codes unchanged.
    - Attention salience, components, min_salience, k, dedup, allocation, investigations, memory and resource receipts unchanged.
    - No LLM calls or venue requests.
  not_in_scope:
    - repeated-rejected-opportunity Attention trigger, rejection episode table or any salience/priority magnitude
    - any time-window grouping or multi-bar setup merging
    - Opportunity registry or Opportunity Context
    - forward-outcome, missed-profit or usefulness labels
    - back-filling legacy rows or parsing skip_reason text
    - correlation, positioning, resource receipts, unassessable memory, usefulness labels, storage guard
    - liquidation clock, portfolio magnitude, Scheme-D, downstream new-data dispatch
    - deployment to the running /home/sarmad/trader kernel
  established_boundary:
    - REJECTION_CODES_COVER_TEXT_PRODUCING_REFUSAL_PATHS_ONLY holds; [] is not success.
    - SDD-STAGE-3-ATTENTION-INVESTIGATION-VALUE-FEEDBACK-V1 is PARKED_LABEL_SOURCE_MISSING; do not invent labels from descriptive, registration-time or P&L evidence.
    - SDD-STAGE-3-ATTENTION-NEW-DATA-STORAGE-CAPACITY-GUARD-V1 is PARKED_OWNER_POLICY_REQUIRED; do not request or invent ledger_max_bytes or min_free_bytes.
    - OPERATOR_STORAGE_POLICY_REQUIRED, EVENT_PAYLOAD_RETENTION_POLICY_REQUIRED and DOWNSTREAM_DISPATCH_PREREQUISITE_REQUIRED remain open and must not become the active package.
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - failed_research_memory is PARTIAL; CORRELATION_UNASSESSABLE_EFFECTIVELY_UNREACHABLE and MEMORY_CONTEXT_NOT_AUTHORITY hold.
    - Attention overall remains IMPLEMENTED; this package grants no maturity upgrade or activation.
  after_completion:
    - Record TESTED evidence in STATE.yaml; update gap_matrix repeated_rejected_opportunities to episode identity SOURCE_TESTED / trigger MISSING (salience policy required); then gate the trigger with a narrow determination, not automatic implementation; no maturity upgrade.

