work_package:
  id: SDD-STAGE-3-ATTENTION-COVERAGE-SEAM
  type: DESIGN_AUDIT
  priority: ACTIVE
  status: READY

  objective: >
    Define the smallest deterministic registry-backed observation-selection seam
    that can choose bounded Attention candidates from venue-active instruments
    without changing trading eligibility.

  working_rule: "locked = don't redesign; implemented = verify; discuss only gaps"

  completed_prerequisite:
    - Bounded isolated supplemental Attention data path is TESTED at 9b95d4f; 91 focused tests passed.
    - One explicitly configured observation-only symbol can reach Attention capture without entering trading paths.

  audit_questions:
    - Which exact RegistrySnapshot records can safely enter the Attention observation candidate population?
    - How should UNKNOWN per-symbol account eligibility be handled for observation without implying trade permission?
    - Should known INELIGIBLE instruments be excluded from Attention or retained for market observation? Reconcile SDD semantics and the previous audit; do not assume.
    - Which registry fields are mandatory for observation among venue status, supported market type, symbol/feed mapping, data availability, account-global canTrade, shortability and order constraints?
    - What deterministic rule prevents starvation while keeping the existing Attention cap bounded?
    - Compare only stable round-robin, one reserved rotating supplemental slot, and stable partition with priority plus rotation.
    - What state or cursor must persist for deterministic replay?
    - Where should selection happen without altering _scan_symbols(), Universe, strategy frames, Risk or Execution?
    - Is a live RegistrySnapshot producer required first, or can the selector accept an injected snapshot initially?
    - Define the smallest next implementation slice without implementing it.

  do_not_implement:
    - Attention selection or fairness logic during this audit
    - live registry producer or refresh
    - trading eligibility or execution changes

  constraints:
    - Audit only; preserve the completed bounded Attention data prerequisite.
    - "locked = don't redesign; implemented = verify; discuss only gaps"
    - Preserve SDD v3.2 as architecture authority and keep trading and execution eligibility unchanged.
    - Preserve the completed Scheme-D bounded pilot as parked, non-final evidence.
    - Do not run another pilot, additional RNG benchmark, full validation, or cloud compute without separate explicit owner authorization.
    - Do not alter frozen research or pilot artifacts.

