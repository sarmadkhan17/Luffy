project: LUFFY
sdd_version: '3.2'

work_package:
  id: SDD-STAGE-3-LIVE-REGISTRY-PRODUCER
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY

  objective: >
    Implement a truthful read-only live RegistrySnapshot producer for the venue
    used by supplemental Attention observation, with explicit
    observation-time/provenance semantics and no trading authority.

  working_rule: "locked = don't redesign; implemented = verify; discuss only gaps"

  completed_prerequisite:
    - SDD-STAGE-3-REGISTRY-ATTENTION-SELECTOR is TESTED at 6eb7eb4 as a pure selector over an injected immutable RegistrySnapshot.
    - SDD-STAGE-3-ATTENTION-LIVE-SELECTION-DEPENDENCY-AUDIT completed as design evidence at 72400ea; dependency order SELECTION-PERSISTENCE -> LIVE-REGISTRY-PRODUCER -> KERNEL-INTEGRATION.
    - SDD-STAGE-3-ATTENTION-SELECTION-PERSISTENCE is TESTED at cda0582 (trader/core/journal.py; trader/observability/selection_persistence.py; tests/test_attention_selection_persistence.py); selection record and cursor_after commit atomically, fetch outcomes cannot move the cursor; not wired into the Kernel.
    - Retained boot CCXT metadata lacks adequate observation-time/provenance truth and must not be re-stamped as a fresh snapshot.
    - Attention overall remains IMPLEMENTED; automatic registry-backed Attention selection is not active.

  scope:
    required_source:
      - public Binance USD-M /fapi/v1/exchangeInfo
    not_required:
      - accountConfig
      - symbolConfig
      - leverageBracket
      - per-symbol eligibility
    unknown_rule: account per-symbol eligibility, and optionally account-global trading, remain UNKNOWN unless later authoritative sources are added
    minimal: the first implementation should be minimal

  requirements:
    - dedicated provider/service separate from Universe/DataFeed trading selection
    - read-only
    - no trading credentials required for this first slice
    - no order APIs
    - explicit target host/venue identity
    - record request start and response receipt time
    - retain serverTime when supplied
    - retain raw-body SHA-256 and source provenance
    - build the existing immutable RegistrySnapshot
    - every account per-symbol eligibility remains UNKNOWN
    - account-global trading may remain UNKNOWN
    - never re-stamp old boot CCXT metadata as fresh
    - a failed refresh never fabricates a new snapshot
    - a later refresh failure keeps the last good snapshot with its original as_of_ms
    - the publisher uses immutable snapshot replacement
    - no Kernel selector wiring yet

  cut_semantics:
    - use an honest local observation cut
    - do not claim atomic exchange time
    - the provider must clearly document what RegistrySnapshot.as_of_ms means
    - preserve endpoint, host and request timing provenance separately from as_of_ms

  required_tests:
    - 1 - successful exchangeInfo translation
    - 2 - provenance and raw-body hash
    - 3 - host/venue identity
    - 4 - immutable latest snapshot
    - 5 - failed first refresh yields no snapshot
    - 6 - failed later refresh leaves the last good snapshot unchanged
    - 7 - no re-stamping
    - 8 - malformed response fails closed
    - 9 - eligibility remains UNKNOWN
    - 10 - no authenticated endpoints
    - 11 - no order calls
    - 12 - no Universe/DataFeed mutation
    - 13 - no Kernel wiring
    - 14 - deterministic translation for identical response and observation cut

  explicitly_deferred:
    - background cadence, unless required by the provider abstraction
    - account metadata calls
    - Kernel integration
    - persistence of RegistrySnapshot history
    - selection cadence
    - live max_snapshot_age_ms config wiring
    - SQLite busy-time/live-loop budget (Kernel integration)
    - demo-vs-production registry venue resolution beyond explicit host/venue identity recording
    - trading changes

  queued_after:
    - KERNEL-INTEGRATION - blocked until a live producer is TESTED; decide cadence, max_snapshot_age_ms config, SQLite busy-time budget and demo-vs-production registry provenance there.

  constraints:
    - "locked = don't redesign; implemented = verify; discuss only gaps"
    - The tested selector and selection-persistence contracts and their tests are locked and unchanged.
    - Preserve SDD v3.2 as architecture authority and keep trading and execution eligibility unchanged.
    - Do not promote Attention overall beyond its current maturity.
    - Preserve the completed Scheme-D bounded pilot as parked, non-final evidence.
    - Do not run another pilot, additional RNG benchmark, full validation, or cloud compute without separate explicit owner authorization.
    - Do not alter frozen research or pilot artifacts.

