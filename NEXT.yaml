work_package:
  id: SDD-STAGE-3-ATTENTION-PORTFOLIO-OBSERVATION-PREREQUISITE
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: >
    Create an immutable, detached, point-in-time venue-position observation from
    an already-existing successful complete Kernel position read, without new
    account API calls and without changing Attention ranking.
  completed_prerequisite:
    - SDD-STAGE-3-ATTENTION-KERNEL-WIRING is TESTED at d3c1f29; registry observation is live when enabled but off by default.
    - SDD-STAGE-3-ATTENTION-GAP-PRIORITY-AUDIT is COMPLETED_DESIGN_EVIDENCE in STATE.yaml with finding ATTENTION-PORTFOLIO-SIGNALS.
    - SDD-STAGE-3-ATTENTION-PORTFOLIO-SOURCE-AUDIT is COMPLETED_DESIGN_EVIDENCE in STATE.yaml; portfolio-state input remains MISSING at the existing Attention cut.
  first_task: Detach and validate an immutable observation at the Kernel's existing suitable successful complete venue-position read.
  likely_files:
    - trader/kernel.py
    - a small typed immutable venue-position observation contract module
    - focused tests
  observation_contract:
    - Prefer a small typed immutable contract with schema/version, venue/source identity, market type, request_start_ms if available at the call boundary, response_received_ms, explicit complete=True, immutable position records and deterministic observation ID/hash.
    - Use local response receipt as the honest cut; as_of_ms == response_received_ms means the complete venue response was known to LUFFY by that local time, not that the exchange supplied an atomic cut.
    - Each position record contains only validated canonical InstrumentId, presence/nonzero-position state, side when unambiguous, finite absolute quantity and raw/source reference as needed for provenance.
    - Do not derive signed quantity without proven side semantics or include notional without validated same-response mark price, contract units and symbol identity.
    - For Binance USD-M require an explicit mapping of connected venue, MarketType.FUTURES, exact venue symbol and canonical InstrumentId; norm_symbol() alone cannot prove identity.
  failure_semantics:
    - A failed, malformed, incomplete or ambiguous position read, duplicate/conflicting instrument rows, or unproven venue/market/symbol identity publishes NO new complete observation.
    - Keep any prior good observation unchanged and never re-stamp it after failure.
    - A missing, failed, partial or ambiguous observation never implies zero positions; absence is meaningful only after a successful complete unambiguous response.
  cycle_placement:
    - Capture and detach where Kernel already performs the suitable successful complete venue-position read; do not reorder the trading cycle solely for Attention.
    - The latest observation may become available only to a later cycle; do not feed it into Attention in this package.
  required_tests:
    - Successful complete read produces an immutable detached observation.
    - Request start and response receipt times are retained; as_of_ms equals response_received_ms.
    - Exact canonical instrument identity, unambiguous side and finite absolute quantity are retained.
    - Mutation of the input venue response cannot mutate the detached observation.
    - The same response and same cut produce the same deterministic observation ID.
    - Failed read and malformed row publish no new complete observation.
    - Duplicate/conflicting symbol rows and ambiguous identity fail closed.
    - Absence is meaningful only after a complete successful response; failed/partial responses never mean flat.
    - Previous good observation is not re-stamped after failure.
    - No new venue/account API call is introduced.
    - Existing Attention ranking and output are unchanged.
    - Trading scan, Orchestrator, Risk and Execution behavior are unchanged.
  constraints:
    - Capture only; do not add portfolio salience, change Attention ranking, move Attention later, add account calls, or change Risk, Accounting, Execution or strategy behavior.
    - Defer feeding the observation into Attention, position-presence salience, notional/exposure, concentration, unrealized P&L, unexplained-loss trigger, portfolio urgency, equity/drawdown, research feedback, WorldModel production and trading authority changes.
    - Preserve Attention overall maturity IMPLEMENTED and the parked non-final Scheme-D pilot; no new pilot, full validation, cloud or RNG work.

