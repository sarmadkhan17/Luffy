work_package:
  id: LUFFY-STAGE3-CLOSURE-R2
  type: READ_ONLY_CLOSURE_CHECK
  status: READY
  objective: >-
    Determine whether SDD v3.2 Stage3 Attention and Research Intelligence is
    BUILD COMPLETE after the question-driven router and generated-question
    handoff/negative-memory implementation. Read and verify existing architecture;
    do not implement or require real-world maturity where SDD requires architecture.
  inputs:
    - SDD.md
    - STATE.yaml
    - docs/superpowers/reports/2026-10-03-stage3-question-driven-research-router-r1.md
    - docs/superpowers/reports/2026-10-03-stage3-generated-question-handoff-negative-memory-r1.md
  acceptance:
    - Classify Attention, research-question generator, Source Router, Source Registry, bounded broker/retrievers, relevance/dedup, Research Bank, cost/budget and failed-research memory against the SDD Stage3 exit.
    - Trace existing event to real shadow producer to persisted exact question to read-only generated-question adapter to worker/router/registry/search/evidence/Bank, without manual question registration or supplied URLs.
    - Verify exact source/registration/invocation provenance and restart idempotency; corrupt or unverifiable questions fail closed.
    - Verify negative historical attempts remain auditable and do not suppress independent questions without registered policy; no production reconsideration policy was installed.
    - Verify immutable positive content reuse retains original identity and timestamps; changed truthful search evidence becomes a separate attempt.
    - Verify existing source metadata unknowns, paid-source owner approval and unsupported-class refusal boundaries.
    - Verify resource bounds and measured cost; classify missing calibrated policies separately from missing architecture.
    - Verify descriptive evidence cannot bypass PredictiveHypothesis transformation, quantitative experiment, protected evaluation, Referee or Factory.
    - Verify collectors remain reusable research-side components and have zero Risk, allocation, StrategySpec, StrategyVersion, execution or live-loop LLM authority.
    - Treat future Attention trigger producers supported by existing interfaces as extension/policy/evidence maturity unless new architecture is required.
    - BUILD COMPLETE requires no missing implementation and a satisfiable normal SDD Stage3 exit; policy, real-evidence and deployment blockers may remain.
  constraints:
    - read only; do not edit, commit or deploy
    - no trading activation, orders, Scheme-D, cloud or paid-source spend
    - no Stage5-7 architecture change or Stage3 redesign
  decision:
    - Return LUFFY_STAGE3_CLOSURE_R2 PASS or BLOCKED with exact missing implementation and policy/evidence/deployment blockers.
    - Recommend LUFFY-STAGE8-OWNER-OS-CLOSURE-R1 only if this closure establishes Stage3 BUILD COMPLETE.

