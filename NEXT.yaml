project: LUFFY
sdd_version: '3.2'

work_package:
  id: SDD-STAGE-3-ATTENTION-KERNEL-INTEGRATION
  type: DESIGN_AUDIT
  priority: ACTIVE
  status: READY

  objective: >
    Define the smallest safe Kernel integration contract connecting the TESTED
    registry producer, TESTED pure selector, TESTED durable selection
    persistence and TESTED isolated supplemental fetch without changing
    trading authority.

  working_rule: "locked = don't redesign; implemented = verify; discuss only gaps"
  mode: audit only

  completed_prerequisite:
    - SDD-STAGE-3-REGISTRY-ATTENTION-SELECTOR is TESTED at 6eb7eb4 as a pure selector over an injected immutable RegistrySnapshot with explicit max_snapshot_age_ms and caller-held cursor.
    - Bounded isolated supplemental Attention data path is TESTED at 9b95d4f (public /fapi/v1/klines in an isolated child, 2-second deadline, Attention capture only).
    - SDD-STAGE-3-ATTENTION-SELECTION-PERSISTENCE is TESTED at cda0582; selection record and cursor_after commit atomically under BEGIN IMMEDIATE; fetch outcomes persist separately and cannot move the cursor.
    - SDD-STAGE-3-LIVE-REGISTRY-PRODUCER is TESTED at 4ee6682 (trader/data/registry_provider.py; tests/test_registry_provider.py); public /fapi/v1/exchangeInfo only; explicit validated production/demo target; as_of_ms is local full-response receipt time; failed refresh never fabricates or replaces a snapshot; no Kernel integration.
    - Attention overall remains IMPLEMENTED; automatic registry-backed Attention selection is not active.

  locked_live_order:
    - 1 - obtain an immutable RegistrySnapshot
    - 2 - load the durable cursor
    - 3 - run the pure selector
    - 4 - atomically persist Selection + cursor_after
    - 5 - only after commit, perform the isolated supplemental fetch
    - 6 - record the fetch outcome separately
    - 7 - feed a usable result only to Attention capture
    - This ordering is locked; the locked persist-before-fetch transaction cannot be skipped.

  audit_questions:
    - 1 - Venue target for live Attention - production, demo or explicitly configured target? Reconcile with the existing supplemental fetch venue and the current trading venue.
    - 2 - Where and when registry refresh runs (startup, background service, cycle or another bounded mechanism) without adding unbounded network latency to the trading cycle.
    - 3 - Justified refresh cadence.
    - 4 - Configurable max_snapshot_age_ms and Kernel behavior when no snapshot exists, the snapshot is stale, or the last refresh failed.
    - 5 - Safe live-loop policy for SQLite persistence given the existing busy timeout.
    - 6 - Selection cadence; do not assume every 60-second trading cycle consumes one rotation slot.
    - 7 - Exact live order implementing locked_live_order.
    - 8 - Behavior on selector refusal, persistence failure, registry unavailable/stale, and supplemental timeout/failure; trading must continue unchanged in every case.
    - 9 - One explicit authority rule for coexistence of manual attention.supplemental_symbol with automatic registry selection; never silently run two supplemental slots.
    - 10 - Provenance/telemetry linking registry snapshot_id, selection_id, fetch result and Attention scan/capture.
    - 11 - Whether integration can proceed without a RegistrySnapshot history store while honestly limiting replay claims.
    - 12 - Choose the smallest implementation slice after the audit.

  known_gaps_to_resolve:
    - no RegistrySnapshot historical store
    - no Kernel selector integration
    - no live max_snapshot_age_ms wiring
    - no refresh scheduling/cadence
    - provider network operation is not a strict total wall-clock deadline because DNS is not bounded
    - SQLite selection-persistence busy-time/live-loop budget unresolved
    - selection cadence unresolved
    - demo-vs-production policy for the live integration unresolved

  do_not_implement:
    - Kernel wiring
    - refresh scheduler
    - config changes
    - new venue calls
    - snapshot history
    - broader fairness
    - trading, Risk or Execution changes

  queued_after:
    - The smallest KERNEL-INTEGRATION implementation slice chosen by this audit.

  constraints:
    - "locked = don't redesign; implemented = verify; discuss only gaps"
    - The tested selector, selection-persistence, supplemental-fetch and registry-producer contracts and their tests are locked and unchanged.
    - Preserve persist-before-fetch ordering and exactly one supplemental slot.
    - Preserve SDD v3.2 as architecture authority and keep trading and execution eligibility unchanged.
    - Do not promote Attention overall beyond its current maturity.
    - Preserve the completed Scheme-D bounded pilot as parked, non-final evidence.
    - Do not run another pilot, additional RNG benchmark, full validation, or cloud compute without separate explicit owner authorization.
    - Do not alter frozen research or pilot artifacts.

