work_package:
  id: SDD-STAGE-3-ATTENTION-NEW-DATA-INPUT-CAPACITY-POLICY-V1
  type: EVIDENCE_AUDIT
  priority: ACTIVE
  status: READY
  objective: Derive a truthful bounded-processing contract for retained candle versions and scan-version references from the existing Attention Store settings, without inventing a count ceiling or arbitrary read deadline.
  basis:
    - SDD-STAGE-3-ATTENTION-NEW-DATA-TRIGGER-V1 is TESTED_BUT_BLOCKED at e3ffa3c (EVENT_CREATION_TESTED_DOWNSTREAM_AND_CAPACITY_POLICY_BLOCKED).
    - INPUT_VERSION_CAPACITY_POLICY_REQUIRED is the smallest prerequisite; MAX_VERSIONS=65_536 is invented and does not follow from allowed Store settings.
    - Synthetic evidence ~213k references completed in about 0.58s; 2M references and the ~16.8M allowed-reference envelope were interrupted by the 1-second read deadline.
    - READ_DEADLINE_S=1.0 is implementation safety policy affecting liveness, not correctness.
  audit_scope:
    - max_scans
    - max_age_seconds
    - max_bytes
    - symbols/timeframes/bars per scan
    - possible versions cardinality
    - possible scan_versions cardinality
    - SQLite read cost
    - whether incremental cursor processing is preferable to rescanning the whole retained store
    - whether bounded batches can preserve exactly-once semantics using deterministic version IDs
  required_behavior:
    - Derive bounds from existing Store settings and code; do not invent a global count ceiling or arbitrary read deadline.
    - Do not change Store retention policy merely to accommodate the trigger.
    - Prefer an incremental/cursor design if it avoids needing a global version-count ceiling.
    - Preserve exactly-once event identity, retired-identity tombstones and fail-closed behavior.
    - Evidence audit only; no code, commit of implementation, downstream dispatch or activation.
    - No salience, ranking, threshold or candidate-generation change; no LLM calls or venue requests; no trading, Risk, Execution or strategy-authority changes.
  established_boundary:
    - Downstream new-data dispatch is NOT implemented and is not queued; DOWNSTREAM_DISPATCH_PREREQUISITE_REQUIRED remains.
    - EVENT_IDENTITY_CAPACITY_POLICY_REQUIRED and EVENT_PAYLOAD_RETENTION_POLICY_REQUIRED remain open.
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - Usefulness/outcome-weighted research feedback remains MISSING / DESIGN_ONLY.
    - Attention overall remains IMPLEMENTED; this queue grants no maturity upgrade or activation.
  after_completion:
    - Record the derived input-capacity contract (or the exact missing evidence) in STATE.yaml; do not mark new-data triggering operational.

