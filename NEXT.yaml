work_package:
  id: SDD-STAGE-3-ATTENTION-PORTFOLIO-SIGNALS
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: >
    Add bounded, point-in-time portfolio-state evidence to Attention priority
    without giving Attention any portfolio allocation, Risk, sizing or trading
    authority.
  completed_prerequisite:
    - SDD-STAGE-3-ATTENTION-KERNEL-WIRING is TESTED at d3c1f29; registry observation is live when enabled but off by default.
    - SDD-STAGE-3-ATTENTION-GAP-PRIORITY-AUDIT is COMPLETED_DESIGN_EVIDENCE in STATE.yaml with finding ATTENTION-PORTFOLIO-SIGNALS.
  first_task: Inspect existing Kernel and accounting sources and choose the smallest truthful live portfolio context seam, preferring a narrow adapter over new account API calls.
  likely_files:
    - trader/kernel.py
    - trader/observability/attention.py
    - trader/cognition/attention.py
    - a small portfolio Attention contract module only if needed
    - focused tests
  evidence_contract:
    - Introduce a typed, immutable portfolio Attention input or evidence record with explicit cut/as_of time and provenance/source on every record.
    - Attach applicable evidence to exact instrument identity.
    - Audit current open-position presence, represented side/direction and notional/exposure for clear live semantics.
    - Use unrealized P&L only if point-in-time truth exists; use realized/daily P&L only if the existing accounting source is point-in-time safe.
    - Use concentration or symbol share only if deterministically derivable from exact current state; use drawdown/equity only if already live with explicit cut semantics.
    - Do not fabricate unavailable portfolio truth; missing, ambiguous, future or stale evidence contributes no signal.
  behavior_contract:
    - Portfolio contribution is a competing salience component, never a trade decision or BUY/SELL direction.
    - Preserve direction independence where appropriate and deterministic results for identical inputs.
    - No portfolio context preserves the legacy Attention result exactly.
    - Strategy scan, registry observation population and existing candle/WorldModel signals remain unchanged when portfolio input is absent.
    - Capture and replay retain enough cut, source, identity and component evidence to explain a portfolio-driven priority change.
  required_tests:
    - No portfolio context preserves the legacy Attention result.
    - Exact-cut evidence is accepted; future or stale evidence is refused or contributes nothing.
    - Open-position state affects salience without creating trade direction.
    - Portfolio evidence leaves trading scan and Orchestrator, Risk and Execution authority unchanged.
    - Missing fields remain explicit; identical inputs give identical results.
    - Telemetry records portfolio contribution and provenance; replay/capture explains the priority change.
  constraints:
    - Portfolio evidence is observational only; Attention may measure salience but may not rebalance, size, allocate, hedge, enter, exit or bypass Risk.
    - Do not change Risk, Accounting authority, Orchestrator, Execution or strategies.
    - Do not implement unexplained portfolio-loss triggers, urgency, research feedback, a live WorldModel producer, RegistrySnapshot history, broader fairness or Scheme-D work.
    - Preserve Attention overall maturity IMPLEMENTED and the parked non-final Scheme-D pilot; no new pilot, full validation, cloud or RNG work.

