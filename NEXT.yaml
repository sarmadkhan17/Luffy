work_package:
  id: SDD-STAGE-3-ATTENTION-NEW-DATA-INCREMENTAL-CURSOR-V1
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: Replace whole-store rescanning in the new-data trigger with bounded incremental processing over the TESTED Store append sequence, preserving exactly-once event semantics and detecting pruned-before-observed gaps.
  basis:
    - SDD-STAGE-3-ATTENTION-STORE-APPEND-SEQUENCE-V1 is TESTED at fe75afb; STORE_APPEND_SEQUENCE_REQUIRED is resolved.
    - Store has immutable attention-store-meta.v1 identity with a stable store_instance_id.
    - Every new candle version has exactly one attention-version-append.v1 receipt; committed sequence is contiguous, monotonic and never reused; high-water never decreases.
    - A missing committed sequence <= high_water truthfully means its parent version was later pruned.
    - Migration receipt order is migration order, not historical insertion chronology.
    - INPUT_VERSION_CAPACITY_POLICY_REQUIRED is to be replaced by bounded incremental processing rather than a global count ceiling.
  required_behavior:
    - Bind cursor state to store label, store_instance_id and append schema/version.
    - Process append receipts in deterministic sequence order.
    - Use bounded batches; do not require the entire Store to fit one pass.
    - Return/report last_seq, high_water and more_available.
    - Cursor advances only in the same transaction as emitted events, refusal records and pruned-before-observed gap records.
    - Crash before commit leaves cursor and ledger unchanged.
    - Retry/restart reprocesses safely with no duplicate events.
    - Missing sequence <= high_water becomes explicit pruned_before_observed, never silent absence.
    - Refused rows are durably recorded once so they do not permanently block the cursor.
    - Store instance mismatch/replacement fails closed; one Store's cursor is never applied to another.
    - Store regression/divergence handling is explicit.
    - Remove dependency on MAX_VERSIONS.
    - READ_DEADLINE_S may remain only as a per-pass fail-closed liveness guard.
    - Preserve retired event identities.
  not_in_scope:
    - MAX_EVENTS lifetime policy
    - event payload retention policy
    - downstream dispatch
  preserve:
    - Attention salience, ranking, thresholds and candidate generation unchanged.
    - Scan rows, hashes and replay unchanged.
    - Population artifacts unchanged.
    - No trading, Risk, Execution or strategy-authority changes; no LLM calls or venue requests.
    - Parked liquidation, Scheme-D and portfolio boundaries unchanged.
  established_boundary:
    - Downstream new-data dispatch is NOT implemented and is not queued; DOWNSTREAM_DISPATCH_PREREQUISITE_REQUIRED remains.
    - EVENT_IDENTITY_CAPACITY_POLICY_REQUIRED and EVENT_PAYLOAD_RETENTION_POLICY_REQUIRED remain open.
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - Usefulness/outcome-weighted research feedback remains MISSING / DESIGN_ONLY.
    - Attention overall remains IMPLEMENTED; this queue grants no maturity upgrade or activation.
  after_completion:
    - Record incremental-cursor evidence in STATE.yaml; resolve INPUT_VERSION_CAPACITY_POLICY_REQUIRED only if TESTED; do not mark new-data triggering operational and do not queue downstream dispatch without a separate decision.

