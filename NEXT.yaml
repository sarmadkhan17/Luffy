work_package:
  id: SDD-STAGE-3-ATTENTION-INVESTIGATION-STATE-FEEDBACK-V1
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: Use coherent current investigation-ledger state during investigation-slot allocation so candidates with already-open investigations do not consume top-k slots, while preserving the original Attention scan, salience ordering, thresholds, and trading authority.
  basis:
    - SDD-STAGE-3-ATTENTION-GAP-REPRIORITIZATION-V2 is COMPLETED_DESIGN_EVIDENCE and selected ATTENTION-INVESTIGATION-STATE-FEEDBACK-V1.
    - Current live flow selects top-k with no active-investigation context, then the investigation consumer rejects duplicates afterward; eligible candidates below the original top-k cannot replace already-active candidates, which can waste available investigation capacity.
  established_boundary:
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - Attention overall remains IMPLEMENTED; this queue grants no maturity upgrade or activation.
  required_behavior:
    - Reuse existing open_episodes semantics in Attention selection (trader/cognition/attention.py; trader/cognition/replay.py).
    - Do not change salience scores or ranking.
    - Do not add weights.
    - Do not change Attention candidate generation.
    - Do not modify original scan rows/hashes.
    - Do not rewrite frozen population receipts or selected/shadow declarations.
    - Existing active investigations continue to update normally.
    - An eligible lower-ranked candidate may fill a slot vacated by an already-active candidate.
    - Capacity limits remain enforced.
    - Missing/refused ledger evidence must fail closed; never treat it as no open investigations.
    - Each contextual selection decision records the source scan ID/hash, policy version, decision time, coherent ledger-state evidence, and the resulting selected candidate IDs.
    - Repeated evaluation of the same contextual decision is idempotent; it cannot progressively register more candidates after, or because of, its own writes.
    - Ledger state written after the decision cut must never be attributed to the earlier decision.
    - No trading, Risk, Execution or strategy-authority changes.
    - No LLM calls or venue requests.
    - Frozen population receipts and selected/shadow assignments remain unchanged.
  acceptance_checks:
    - An eligible lower-ranked candidate fills a slot when a higher-ranked candidate already has an active investigation.
    - With no active investigations, selection is identical to legacy behavior.
    - Missing or refused ledger evidence fails closed.
    - Capacity limits remain enforced.
    - Repeating the same decision yields identical selection and no progressive admissions.
    - Existing active investigations continue updating normally.
    - Original Attention scan rows, hash and replay remain unchanged.
    - Frozen population artifacts remain unchanged.
  after_completion:
    - Record test evidence and commit; do not upgrade Attention overall maturity without acceptance evidence.

