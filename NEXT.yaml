work_package:
  id: LUFFY-STAGE3-QUESTION-DRIVEN-RESEARCH-ROUTER-R1
  type: IMPLEMENTATION
  status: RECOMMENDED_NOT_STARTED
  objective: >-
    Close the one mandatory Stage3 architecture gap before Stage8: take a
    registered ResearchQuestion, route it to appropriate authoritative source
    classes, discover/select sources through a typed external Source Registry,
    perform bounded metadata search/retrieval with deterministic filter/dedup,
    and store structured evidence in the existing Research Bank.

  preserve:
    - existing Attention/investigation semantics
    - existing internal research-source-registry.v1 contracts
    - existing Scraper/DeepCrawler as reusable retrievers where appropriate
    - predictive research bridge and quantitative/referee boundaries
    - Stage5-7 architecture freeze
    - zero LLM dependency in the normal live trading loop
    - research has zero Risk/Execution/trading authority

  implementation_boundary:
    - extend/reuse existing research-question and source abstractions; do not create a second Research Bank or validation system.
    - external source metadata must represent source_id, type, domains, primary/secondary, credibility class, cost, access method, historical depth, rate limits and known weaknesses without inventing unknown values.
    - Source Router maps question type/scope to source classes; it does not decide truth.
    - Search Broker/retrievers are asynchronous/research-side and bounded by query/page/time/cost budgets.
    - deterministic metadata filtering, URL/content dedup and cheap relevance happen before optional LLM synthesis.
    - evidence retains URL/source, retrieval/availability time, content hash, question id, query/provenance and extraction status.
    - paid-source adoption requires owner approval; no new paid source is authorized by this package.
    - failed/empty/unavailable retrieval is explicit evidence, not a fabricated quiet result.
    - external evidence cannot directly create a StrategyVersion or predictive edge.

  acceptance:
    - one normal registered research question selects source classes without a user-supplied URL.
    - at least one bounded external retriever path uses the router/registry and records exact provenance.
    - deterministic filter/dedup prevents duplicate evidence work.
    - structured Research Bank object links question, sources, evidence, limitations, cost/status and next questions.
    - unsupported question/source class fails closed.
    - no network call occurs in the live trading decision loop.
    - no Risk, Execution, StrategySpec, StrategyVersion or trading authority changes.
    - existing predictive bridge only consumes research results after its own provenance and quantitative gates.
    - tests prove restart/idempotency and bounded resource behavior.

  constraints:
    - no deployment or restart
    - no trading activation or venue orders
    - no Risk or StrategySpec changes
    - no Scheme-D pilot/benchmark/full validation
    - no cloud or paid-data spend
    - no Stage5-7 redesign

after_completion:
  - run a narrow Stage3 closure check only.
  - if Stage3 exit is satisfied, Stage8 architecture may start while Stage1/2/4 operational/evidence maturity continues separately.
