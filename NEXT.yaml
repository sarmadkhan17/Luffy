project: LUFFY
sdd_version: '3.2'

work_package:
  id: SDD-STAGE-3-DECISION-REJECTION-REASON-CODES-V1
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: Record a structured, versioned rejection reason code at every existing refusal branch of a trading decision, alongside the unchanged skip_reason text, so LUFFY remembers why each opportunity was refused as machine-readable evidence (source for SDD 8.1 repeated rejected opportunities).
  basis:
    - SDD-STAGE-3-CAPABILITY-SELECTION-V3 - NO_INTELLIGENCE_TRIGGER_DIRECTLY_IMPLEMENTABLE_SMALLEST_MISSING_SOURCE_SELECTED.
    - SDD.md 8.1 names repeated rejected opportunities as an Attention trigger.
    - Journal decisions.skip_reason is free text built from templates with embedded values and "; "-joined parts; no structured code exists, so refusals cannot be counted without parsing prose.
  source:
    - Existing refusal branches only - trader/engine/orchestrator.py strategy_gate (no strategy signal; no strategy agrees), HTF hard veto, meta veto, entries-not-allowed/blocked_reason; trader/engine/risk.py check_entry SizingResult refusals (state FROZEN/HALTED/other, daily breaker, max positions, already exposed, heat cap, margin cap, below min notional) and RiskError halt; trader/kernel.py stop-timeframe bars missing and meta-sized below min notional; trader/engine/executor.py execution_recovery_pending and submission-time entry block.
    - No venue request, LLM call, DataFeed change, recorder or new store.
  missing_transformation:
    - A frozen code vocabulary (decision-rejection-reason.v1) with exactly one code per existing refusal branch, set at the branch where the text is set, persisted with the decision.
  frozen_semantics:
    - A code names the code branch that refused; it is not a judgement that the opportunity was good, bad, missed or costly.
    - Codes are an ordered list mirroring skip_reason composition order; executed decisions and HOLD decisions with no refusal carry an empty list.
    - Whenever a later stage overwrites skip_reason (kernel entry path, update_decision_outcome, executor), the codes are overwritten with the same semantics, so text and codes always describe the same refusal.
    - Every refusal branch has a code; a refusal without a code is a test failure (exhaustiveness), never a silent UNCODED.
    - Legacy rows keep reason_codes NULL meaning not recorded; no back-fill by parsing text.
    - skip_reason text, action, score, threshold, executed, size, order calls, control-state transitions and risk state are byte-identical to before.
  implementation_boundary:
    - trader/engine/risk.py - SizingResult carries a code; reason text unchanged.
    - trader/engine/orchestrator.py - codes alongside skip_bits.
    - trader/kernel.py and trader/engine/executor.py - codes set where skip_reason is set.
    - trader/core/types.py and trader/core/journal.py - Decision field; additive decisions.reason_codes column via the existing ALTER TABLE migration pattern; log_decision/update_decision_outcome persist it.
  acceptance_tests:
    - tests/test_decision_rejection_reason_codes.py (new) - each refusal branch yields exactly its code; composite orchestrator refusals yield codes in skip_bits order; executed and plain HOLD decisions carry an empty list; overwrites replace codes consistently with text; skip_reason text and action/score/size/executed/order calls identical to pre-change behavior for every branch; exhaustiveness over the vocabulary; migration idempotent on an existing journal; legacy rows stay NULL.
    - Existing tests/test_orchestrator_abstention.py, test_orchestrator_agreement.py, test_risk_state_persistence.py, test_entry_control_fence.py, test_r_multiple_uses_entry_risk.py and test_attention_kernel_wiring.py pass apart from recorded baseline failures.
    - scripts/backtest_equivalence.py PASS is unaffected (no backtest-engine change).
    - git diff --check clean.
  preserve:
    - Trading decisions, sizing, Risk limits, Execution, protective stops and control state unchanged.
    - Attention salience, components, min_salience, k, dedup, allocation, investigations, memory and resource receipts unchanged.
    - No LLM calls or venue requests.
  not_in_scope:
    - repeated-rejected-opportunity Attention trigger, episode clustering or any salience/priority magnitude
    - Opportunity registry or Opportunity Context
    - forward-outcome, missed-profit or usefulness labels from outcomes
    - back-filling or parsing legacy skip_reason text
    - correlation, positioning, resource receipts, unassessable memory, usefulness labels, storage guard
    - liquidation clock, portfolio magnitude, Scheme-D, downstream new-data dispatch
    - deployment to the running /home/sarmad/trader kernel
  established_boundary:
    - SDD-STAGE-3-ATTENTION-INVESTIGATION-VALUE-FEEDBACK-V1 is PARKED_LABEL_SOURCE_MISSING; do not invent labels from descriptive, registration-time or P&L evidence.
    - SDD-STAGE-3-ATTENTION-NEW-DATA-STORAGE-CAPACITY-GUARD-V1 is PARKED_OWNER_POLICY_REQUIRED; do not request or invent ledger_max_bytes or min_free_bytes.
    - OPERATOR_STORAGE_POLICY_REQUIRED, EVENT_PAYLOAD_RETENTION_POLICY_REQUIRED and DOWNSTREAM_DISPATCH_PREREQUISITE_REQUIRED remain open and must not become the active package.
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - failed_research_memory is PARTIAL; CORRELATION_UNASSESSABLE_EFFECTIVELY_UNREACHABLE and MEMORY_CONTEXT_NOT_AUTHORITY hold.
    - Attention overall remains IMPLEMENTED; this package grants no maturity upgrade or activation.
  after_completion:
    - Record TESTED evidence in STATE.yaml; add gap_matrix repeated_rejected_opportunities as SOURCE_TESTED / trigger MISSING (episode definition and salience policy required); no maturity upgrade.

