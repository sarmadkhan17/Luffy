work_package:
  id: SDD-STAGE-3-REPEATED-REJECTION-SIGNAL-OCCURRENCE-OBSERVATION-V1
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: Derive a deterministic, descriptive rejection history per exact strategy-signal-occurrence.v1 key from persisted decisions - observing decision scans, executed / coded-refusal / uncoded-non-execution / codes-not-recorded counts, ordered reason-code history, whether any observing decision executed, and first/last observed decision times.
  basis:
    - SDD-STAGE-3-REPEATED-REJECTION-SIGNAL-OCCURRENCE-DETERMINATION-V1 - REPEATED_REJECTION_SIGNAL_OCCURRENCE_V1_IMPLEMENTABLE.
    - SDD-STAGE-3-DECISION-REJECTION-REASON-CODES-V1 TESTED at cccfbd8 - decisions.reason_codes / reason_codes_version.
    - SDD-STAGE-3-STRATEGY-SIGNAL-OCCURRENCE-IDENTITY-V1 TESTED at 230eaa0 - signal_occurrence() over persisted signals_json.
    - Every scanned symbol logs one decision row per scan with every fired signal in signals_json, so the key and codes are joinable exactly within the same row.
  source:
    - Journal decisions rows - id, ts, scan_id, symbol, action, executed, reason_codes, reason_codes_version, signals_json.
    - trader/strategy/signal_occurrence.py signal_occurrence() - the only key derivation.
    - No venue request, LLM call, DataFeed change, recorder, new store or new column.
  missing_transformation:
    - A pure function over decision rows that groups observing rows by exact occurrence key and returns, per key - n_observing_decisions, n_executed, n_coded_refusal (executed=0 and non-empty reason_codes), n_uncoded_non_execution (executed=0 and reason_codes '[]'), n_codes_not_recorded (reason_codes NULL), executed_ever, first_observed_ts, last_observed_ts, and the ts-ordered history of (ts, decision_id, scan_id, decision action, executed, reason_codes).
    - Per-reason counts of signals without a key (unavailable reasons from signal_occurrence()), reported separately and never assigned a key.
    - A thin read-only Journal accessor feeding that function; no write.
  frozen_semantics:
    - Unit is one exact strategy-signal-occurrence.v1 key; consecutive signal bars are never grouped; no time window.
    - Counts are scan observations of one occurrence, not independent opportunities; no output field is named or described as an opportunity or episode count.
    - reason_codes and executed are decision-level - attribution reads "a decision carrying this occurrence", not "this signal caused"; decision action is reported alongside because it can differ from the occurrence action.
    - Coded refusal requires non-empty reason_codes; '[]' is uncoded non-execution (not success, not rejection); NULL is not recorded; the three are never merged.
    - executed is the row's persisted final value; no inference from trades, outcomes or fills.
    - Rows without a keyed signal and legacy rows are excluded from key groups; no reconstruction from ts, signal_bar_age_min or skip_reason text.
    - Output is descriptive; it does not emit an Attention cause, change salience or trigger anything.
  implementation_boundary:
    - One new pure module next to trader/strategy/signal_occurrence.py for the per-occurrence summary.
    - trader/core/journal.py - one read-only query method if needed; no schema change.
  acceptance_tests:
    - tests/test_repeated_rejection_signal_occurrence.py (new) - repeated scans of one occurrence aggregate into one key with exact counts and ts-ordered code history; consecutive bars, different spec fingerprint/symbol/action/timeframe stay separate keys; coded refusal, '[]' and NULL rows are counted in separate buckets; an executed row sets executed_ever and is not counted as refusal; multi-signal rows contribute to each carried key with decision-level codes and decision action reported; opposite-action occurrence in a refused row keeps its own key; keyless signals are counted by unavailable reason and never grouped; legacy rows without occurrence fields excluded; symbol aliases collapse via venue_key; result is deterministic under row reordering; function is read-only (journal unchanged).
    - tests/test_strategy_signal_occurrence_identity.py and tests/test_decision_rejection_reason_codes.py pass apart from recorded baseline failures.
    - scripts/backtest_equivalence.py PASS unaffected (no backtest-engine change).
    - git diff --check clean.
  preserve:
    - Trading decisions, signals, sizing, Risk limits, Execution, protective stops, control state, skip_reason, reason_codes and signals_json unchanged.
    - Attention salience, components, min_salience, k, dedup, allocation, investigations, memory and resource receipts unchanged.
    - No LLM calls or venue requests.
  not_in_scope:
    - repeated-rejected-opportunity Attention trigger, firing predicate, count threshold, salience or priority magnitude
    - multi-bar rejection-episode grouping, time windows or setup merging
    - independent opportunity counts, Opportunity registry or Opportunity Context
    - coding the signal-cooldown or other non-text refusal paths
    - forward-outcome, missed-profit or usefulness labels
    - back-filling legacy rows or parsing skip_reason text
    - correlation, positioning, resource receipts, unassessable memory, usefulness labels, storage guard
    - liquidation clock, portfolio magnitude, Scheme-D, downstream new-data dispatch
    - deployment to the running /home/sarmad/trader kernel
  established_boundary:
    - SIGNAL_OCCURRENCE_IS_NOT_OPPORTUNITY_EPISODE holds.
    - REJECTION_CODES_COVER_TEXT_PRODUCING_REFUSAL_PATHS_ONLY holds; [] is not success.
    - Rejection-episode grouping semantics remain UNDETERMINED; the trigger remains MISSING.
    - SDD-STAGE-3-ATTENTION-INVESTIGATION-VALUE-FEEDBACK-V1 is PARKED_LABEL_SOURCE_MISSING; do not invent labels from descriptive, registration-time or P&L evidence.
    - SDD-STAGE-3-ATTENTION-NEW-DATA-STORAGE-CAPACITY-GUARD-V1 is PARKED_OWNER_POLICY_REQUIRED; do not request or invent ledger_max_bytes or min_free_bytes.
    - OPERATOR_STORAGE_POLICY_REQUIRED, EVENT_PAYLOAD_RETENTION_POLICY_REQUIRED and DOWNSTREAM_DISPATCH_PREREQUISITE_REQUIRED remain open and must not become the active package.
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - failed_research_memory is PARTIAL; CORRELATION_UNASSESSABLE_EFFECTIVELY_UNREACHABLE and MEMORY_CONTEXT_NOT_AUTHORITY hold.
    - Attention overall remains IMPLEMENTED; this package grants no maturity upgrade or activation.
  after_completion:
    - Record TESTED evidence in STATE.yaml; update gap_matrix repeated_rejected_opportunities with occurrence-level observation TESTED / rejection-episode grouping UNDETERMINED / trigger MISSING; gate any trigger with a separate determination, not automatic implementation; no maturity upgrade.

