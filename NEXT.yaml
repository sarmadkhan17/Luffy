work_package:
  id: SDD-STAGE-3-ATTENTION-INVESTIGATION-VALUE-PROTOCOL-V1
  type: DESIGN
  priority: ACTIVE
  status: READY
  objective: >
    Specify one concrete question protocol that instantiates investigation-value.v1
    with frozen baseline, admissible evidence, closure rules, horizon and resource bounds.
  established_boundary:
    - MINIMAL_NEW_CONTRACT_REQUIRED; frozen concept and review reconciliation are in STATE.yaml completed_attention_investigation_value_reconciliation.
    - Demonstrated question-specific evidential usefulness is distinct from trading profit, market movement and comparative Attention optimality.
    - Bounded value requires ESTABLISHED, a valid protocol and WITHIN_BOUND; confirmation is not ranked above falsification.
    - Detached portfolio observation remains TESTED at 285b0ce; live Attention portfolio input remains PARTIAL_PREREQUISITE_ESTABLISHED with no justified portfolio salience magnitude.
  required_design:
    - Choose one concrete decision-relevant question, knowledge gap and alternatives; freeze immutable versioned protocol/case identity and prospective registration requirements.
    - Specify initial evidence, the routine-evidence baseline, admissible evidence and exact point-in-time provenance and missingness rules.
    - Define deterministic predicates for PENDING, ESTABLISHED, NOT_ESTABLISHED and UNASSESSABLE, protocol validity, and the closure receipt.
    - Freeze the horizon, deadline, stopping rules, resource bounds, accounting units and per-case cost receipt; preserve UNKNOWN separately from WITHIN_BOUND and EXCEEDED.
    - Declare selected/shadow assignment and a bounded prospective sampling policy; investigating every unselected candidate is not required.
  acceptance:
    - The versioned question protocol instantiates every minimum field of investigation-value.v1 in STATE.yaml and makes closure and resource compliance independently assessable.
    - No universal numeric utility, probabilities, entropy or full calibration/power design is required for descriptive shadow collection.
    - Coverage, pairing and resource telemetry can precede usefulness labels; value-labelled collection requires the concrete protocol first.
    - Comparative priority value remains a later selected/shadow evidence question; this protocol alone cannot establish optimal Attention allocation.
  constraints:
    - DESIGN / CONTROL-PLANE only; no implementation or collection in this work package.
    - Do not queue shadow-store implementation yet.
    - No portfolio weight, ranking, selection, Risk, Execution or research-admission change.
    - Preserve the parked non-final Scheme-D pilot; no new pilot, full validation, cloud or RNG work.

