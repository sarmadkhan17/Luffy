work_package:
  id: SDD-STAGE-3-ATTENTION-POSITIONING-INVESTIGATION-FAMILY-V1
  type: IMPLEMENTATION
  priority: ACTIVE
  status: READY
  objective: Give positioning-dominant Attention candidates a truthful deterministic investigation family so that a valid positioning extreme does not consume an Attention slot without a research path.
  basis:
    - SDD-STAGE-3-ATTENTION-POSITIONING-EXTREMES-V1 is TESTED at 9816caa; positioning_extreme is valid Attention evidence.
    - Known boundary POSITIONING_INVESTIGATION_FAMILY_MISSING - trader/cognition/investigation.py FAMILIES covers volume_anomaly, volatility_transition and relative_return_divergence only.
    - A positioning-dominant candidate may legitimately enter top-k, then receives registration_reason = no_investigation_family in trader/observability/investigation.py and consumes a top-k slot without producing an investigation.
    - This is the next downstream intelligence seam, not a failure of positioning capture or salience.
  selection_principle:
    - Do not redesign Attention ranking.
    - Do not suppress positioning candidates merely because the family was missing; the signal is already accepted as valid Attention evidence.
    - Close the missing research path instead.
  before_implementation:
    - Inspect the existing investigation-family/template architecture (trader/cognition/investigation.py FAMILIES and open_investigation; trader/observability/investigation.py registration) and identify the smallest existing pattern that can support positioning.
    - Prefer reuse of the current investigation machinery; do not create a new general research framework.
    - The investigation consumes already-captured immutable evidence only; no live derivs.db query from replay or investigation.
  investigation_question: Is the observed positioning extreme meaningfully different from the candidate's recent positioning baseline, and what concurrent captured market evidence supports or contradicts that distinction?
  must_not_assume:
    - extreme long positioning is bearish
    - extreme short positioning is bullish
    - funding sign predicts direction
    - a positioning extreme itself is a trading signal
  outcome_rule: Confirmation and falsification are both valid investigation outcomes.
  preserve:
    - Positioning z calculation unchanged.
    - Attention salience/ranking, k and min_salience unchanged.
    - Derivatives recorder unchanged.
    - Existing non-positioning investigation families unchanged.
    - Replay and hashes of snapshots without positioning input unchanged.
    - Population artifacts unchanged.
    - No trading, Risk, Execution or strategy-authority changes; no live LLM usage or venue requests.
    - Parked storage-capacity guard, liquidation, Scheme-D and portfolio boundaries unchanged.
  acceptance_tests:
    - A positioning-dominant candidate maps to a real investigation family.
    - It no longer receives registration_reason = no_investigation_family.
    - The family uses persisted captured evidence only.
    - Replay works without derivs.db present.
    - Positive and negative extremes are treated symmetrically.
    - No directional trading conclusion is embedded.
    - Existing non-positioning investigation families remain unchanged.
    - Investigation-state allocation and idempotence tests remain passing.
  not_in_scope:
    - Attention ranking or salience changes; suppression of positioning candidates
    - new derivatives series, venue requests, recorder or backfill changes
    - a general research framework
    - Store retention policy changes (positioning payload growth of ~45-50 KB per 16-symbol scan is recorded, not addressed here)
    - storage-capacity guard, downstream new-data dispatch, payload retention
  established_boundary:
    - SDD-STAGE-3-ATTENTION-NEW-DATA-STORAGE-CAPACITY-GUARD-V1 is PARKED_OWNER_POLICY_REQUIRED; do not request or invent ledger_max_bytes or min_free_bytes.
    - OPERATOR_STORAGE_POLICY_REQUIRED, EVENT_PAYLOAD_RETENTION_POLICY_REQUIRED and DOWNSTREAM_DISPATCH_PREREQUISITE_REQUIRED remain open and must not become the active package.
    - forced-liquidation-participation.v1 remains PARKED; M3.2 Scheme-D remains PARKED.
    - Portfolio magnitude remains blocked by NO_JUSTIFIED_PORTFOLIO_MAGNITUDE_YET; portfolio salience remains BLOCKED_UPSTREAM.
    - Usefulness/outcome-weighted research feedback remains MISSING / DESIGN_ONLY.
    - The running /home/sarmad/trader kernel does not contain positioning extremes; this package does not deploy.
    - Attention overall remains IMPLEMENTED; this package grants no maturity upgrade or activation.
  after_completion:
    - Record TESTED evidence in STATE.yaml, resolve POSITIONING_INVESTIGATION_FAMILY_MISSING only if all acceptance tests pass, and set gap_matrix positioning_investigation_family accordingly; no maturity upgrade.

