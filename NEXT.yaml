work_package:
  id: SDD-CLOCK-HEALTH-VM-ENVIRONMENT-IDENTITY-V1
  type: EVIDENCE_AUDIT
  priority: ACTIVE
  status: READY
  objective: Identify the exact VMware hosting environment needed to determine which authoritative vendor guarantees, lifecycle interfaces and clock contracts actually apply to this LUFFY guest.
  established_boundary:
    - SDD-FORCED-LIQUIDATION-RECORDER-COVERAGE-V1 remains TESTED; RECORDER_TESTED_PRODUCTION_COVERAGE_BLOCKED remains.
    - PRODUCTION_POLICY and PRODUCTION_CLOCK_HEALTH_POLICY remain null.
    - SDD-CLOCK-HEALTH-EXTERNAL-GUARANTEE-EVIDENCE-V1 is COMPLETED_DESIGN_EVIDENCE with decision EXTERNAL_GUARANTEE_REQUIRED on the supplied authoritative review.
    - Existing NTP remains a candidate; ALTERNATE_CLOCK_SOURCE_REQUIRED remains NOT_ESTABLISHED.
    - NTS solves authentication only, not UTC accuracy, VM propagation or lifecycle; chrony/PTP/PHC are not automatically sufficient.
  scope:
    mode: Read-only local identification first, where accessible without configuration changes.
    identify:
      - VMware product family (ESXi/vSphere, Workstation, Fusion or other VMware product).
      - Host/product/build/version evidence visible to the guest.
      - Virtual hardware compatibility/version.
      - VMware Tools/open-vm-tools version and effective time-sync settings.
      - Whether VM Generation ID is actually exposed/bound in this guest.
      - ACPI/device evidence relevant to VMGenID.
      - Available guest-visible hypervisor clock interfaces.
      - Whether vSphere GuestInfo, VMware RPC or another read-only interface exposes host/environment identity.
      - Effective lifecycle time-sync settings where guest-visible.
      - Evidence of snapshot/migration/event-generation interfaces accessible from the guest.
    evidence_boundary: Do not guess from VMware Virtual Platform; distinguish observed identity/settings, inaccessible evidence and documented applicability.
  external_evidence_boundary:
    trigger: If required host identity/settings are not guest-visible, return OWNER_OR_PROVIDER_EVIDENCE_REQUIRED and list exactly what must be supplied externally.
    potential_required_items:
      - VMware product.
      - Host version/build.
      - Virtual hardware version.
      - Relevant VM advanced/lifecycle settings.
      - VMGenID exposure.
      - Available vCenter/vSphere API.
      - Provider/service identity.
    request_boundary: Request only the smallest missing external information needed before continuing clock-source qualification; never request credentials or secrets.
  decision_required:
    cardinality: Return exactly one decision after the audit.
    allowed:
      - ENVIRONMENT_IDENTITY_SUFFICIENT
      - OWNER_OR_PROVIDER_EVIDENCE_REQUIRED
      - ENVIRONMENT_NOT_VMWARE_SUPPORTED_PATH
    if_sufficient: Identify which existing authoritative documentation actually applies to this guest.
    if_not_sufficient: Identify the smallest external information request required before continuing clock-source qualification.
  constraints:
    - No implementation, commit, host/service/config changes, collection or long-lived monitoring.
    - Do not install VMware tools/components, change VM settings or select/install an alternate clock source.
    - No liquidation deployment, production policy activation or Attention/Risk/Execution changes.
    - Preserve frozen protocol, unrelated knowledge edits, portfolio PARTIAL_PREREQUISITE_ESTABLISHED and all parked research boundaries; no pilot, validation, cloud or RNG work.

