work_package:
  id: SDD-CLOCK-HEALTH-RECEIPT-V1
  type: DESIGN_PREREQUISITE
  priority: ACTIVE
  status: QUEUED_NOT_STARTED
  objective: Qualify existing timesyncd/kernel clock telemetry and design a durable receipt that can bound absolute UTC uncertainty over a registered window; return source-insufficient if unsupported.
  established_boundary:
    - SDD-FORCED-LIQUIDATION-RECORDER-COVERAGE-V1 is TESTED at 4c63e82; 96 focused tests passed. Verified command was /home/sarmad/trader/venv/bin/python -m pytest -q tests/test_forced_liquidation_recorder.py (Python 3.12.3; websockets 17.0.1).
    - RECORDER_TESTED_PRODUCTION_COVERAGE_BLOCKED; PRODUCTION_POLICY and PRODUCTION_CLOCK_HEALTH_POLICY remain None.
    - Host synchronization telemetry exists, but no verified durable whole-window UTC uncertainty receipt is established.
  dependency_order:
    - Transport evidence semantics are recorded in STATE.yaml; clock source/receipt qualification is the smallest next prerequisite.
    - Production coverage policy completion also needs justified liveness-gap, rollover-overlap and offset-drift bounds; it is not queued concurrently.
  smallest_scope:
    - Inspect versioned timesyncd/kernel source semantics and identify what raw measurements, trust assumptions and continuity evidence can support a conservative interval bound.
    - Specify immutable receipt identity, raw bytes/hash, host/boot/source/version provenance, UTC/monotonic/boottime samples and deterministic independent verification.
    - Define freshness, holdover, uncertainty propagation and step/suspend/reboot failure handling without inventing numeric thresholds.
    - If existing telemetry is insufficient, return the smallest additional source/evidence requirement and a bounded measurement design; do not install services or run collection.
  acceptance:
    - Explicitly distinguish candidate telemetry from a qualified source and a verified whole-window receipt.
    - Explain how evidence bounds the entire registered interval including uncertainty-expanded coverage brackets; a current synchronized flag is insufficient.
    - Specify rejection cases for missing/stale/untrusted evidence, clock steps, unsync, suspend/resume, reboot, forged bounds and replay tampering.
    - No signed recvWindow, HTTPS success, stable monotonic/UTC offset or fixture policy may authorize production PASS.
  constraints:
    - DESIGN / CONTROL-PLANE only; no implementation, commit, deployment, prospective collection or clock/service changes.
    - Neither production policy global is activated; production sealing and Attention/Risk/Execution behavior remain unchanged.
    - Preserve frozen protocol, unrelated knowledge edits, portfolio PARTIAL_PREREQUISITE_ESTABLISHED and all parked research boundaries; no pilot, validation, cloud or RNG work.

