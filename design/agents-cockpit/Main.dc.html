<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#08090c;--panel:#101319;--line:#1c222e;--line2:#262e3d;
      --txt:#e6eaf0;--dim:#8b95a6;--dimmer:#525d6e;
      --green:#00d1a0;--red:#ff5c74;--amber:#ffb224;--blue:#4da3ff;--violet:#9b7bff;
      --mono:'JetBrains Mono',ui-monospace,monospace;
      --sans:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--txt)}
    a{color:var(--green)} a:hover{color:#00e6b0}
    .scene{position:relative;width:1000px;height:640px;overflow:hidden;
      background:
        radial-gradient(120% 90% at 50% 38%, rgba(0,209,160,.07), transparent 60%),
        radial-gradient(140% 120% at 50% 120%, rgba(77,163,255,.06), transparent 55%),
        var(--bg);}
    .grid{position:absolute;inset:0;opacity:.5;
      background-image:linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(90% 80% at 50% 45%, #000 30%, transparent 75%);}
    .hud{position:absolute;font-family:var(--mono);letter-spacing:.02em}
    .tl{left:22px;top:20px}
    .kicker{font-size:10px;color:var(--dimmer);letter-spacing:.22em;text-transform:uppercase}
    .h1{font-size:19px;font-weight:800;margin-top:5px;letter-spacing:-.01em;font-family:var(--sans)}
    .sub{font-size:11px;color:var(--dim);margin-top:3px}
    .legend{right:22px;top:22px;display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--dim)}
    .legend .row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
    .dot{width:8px;height:8px;border-radius:50%}
    .cap{left:22px;bottom:18px;display:flex;align-items:center;gap:10px;
      font-size:11px;color:var(--dim)}
    .pillchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
      background:rgba(16,19,25,.7);border:1px solid var(--line2);backdrop-filter:blur(6px)}
    .live{width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 0 0 rgba(0,209,160,.6);animation:pl 1.8s infinite}
    @keyframes pl{0%{box-shadow:0 0 0 0 rgba(0,209,160,.55)}70%{box-shadow:0 0 0 9px rgba(0,209,160,0)}100%{box-shadow:0 0 0 0 rgba(0,209,160,0)}}
    .nlabel{font-family:var(--mono);font-size:11px;font-weight:600}
    .nmetric{font-family:var(--mono);font-size:9.5px;fill:var(--dim)}
    .drift{right:22px;bottom:18px;font-size:10px;color:var(--dimmer)}
  </style>
</helmet>

<div class="scene">
  <div class="grid"></div>

  <svg width="1000" height="640" viewBox="0 0 1000 640" fill="none"
       style="position:absolute;inset:0">
    <defs>
      <radialGradient id="core" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00ffc6"/>
        <stop offset="45%" stop-color="#00d1a0"/>
        <stop offset="100%" stop-color="#063d31"/>
      </radialGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
    </defs>

    <!-- concentric orbit rings -->
    <ellipse cx="500" cy="312" rx="158" ry="150" stroke="#12331f" stroke-opacity=".5" stroke-width="1"/>
    <ellipse cx="500" cy="312" rx="330" ry="232" stroke="#132132" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 6"/>

    <!-- synapses: core -> team -->
    <g stroke="#00d1a0" stroke-opacity=".26" stroke-width="1.2">
      <line x1="500" y1="312" x2="500" y2="162"/>
      <line x1="500" y1="312" x2="634" y2="234"/>
      <line x1="500" y1="312" x2="634" y2="390"/>
      <line x1="500" y1="312" x2="500" y2="462"/>
      <line x1="500" y1="312" x2="366" y2="390"/>
      <line x1="500" y1="312" x2="366" y2="234"/>
    </g>
    <!-- faint links team -> analysts (depth) -->
    <g stroke="#26405f" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="2 5">
      <line x1="500" y1="162" x2="500" y2="82"/>
      <line x1="634" y1="234" x2="760" y2="168"/>
      <line x1="634" y1="390" x2="824" y2="362"/>
      <line x1="500" y1="462" x2="644" y2="516"/>
      <line x1="500" y1="462" x2="356" y2="516"/>
      <line x1="366" y1="390" x2="178" y2="362"/>
      <line x1="366" y1="234" x2="242" y2="168"/>
    </g>

    <!-- OUTER analyst nodes (smaller, dimmer = further back) -->
    <g opacity=".82">
      <!-- each: soft halo + node + status ring -->
      <circle cx="500" cy="82"  r="20" fill="#0a3d31" filter="url(#soft)" opacity=".5"/>
      <circle cx="500" cy="82"  r="9" fill="#0c1017" stroke="#00d1a0" stroke-width="1.6"/>
      <text x="500" y="60" text-anchor="middle" class="nmetric">Structure · 15%</text>

      <circle cx="760" cy="168" r="9" fill="#0c1017" stroke="#00d1a0" stroke-width="1.6"/>
      <text x="778" y="164" class="nmetric">Momentum · 27%</text>

      <circle cx="824" cy="362" r="9" fill="#0c1017" stroke="#00d1a0" stroke-width="1.6"/>
      <text x="806" y="388" text-anchor="end" class="nmetric">Depth · 38%</text>

      <circle cx="644" cy="516" r="9" fill="#0c1017" stroke="#4da3ff" stroke-width="1.6"/>
      <text x="644" y="538" text-anchor="middle" class="nmetric">Value · 75%</text>

      <circle cx="356" cy="516" r="9" fill="#0c1017" stroke="#00d1a0" stroke-width="1.6"/>
      <text x="356" y="538" text-anchor="middle" class="nmetric">Flow · 29%</text>

      <circle cx="178" cy="362" r="9" fill="#0c1017" stroke="#525d6e" stroke-width="1.6"/>
      <text x="196" y="388" class="nmetric">Rotation · 20%</text>

      <circle cx="242" cy="168" r="9" fill="#0c1017" stroke="#00d1a0" stroke-width="1.6"/>
      <text x="224" y="164" text-anchor="end" class="nmetric">Positioning · 33%</text>
    </g>

    <!-- TEAM nodes (mid ring) -->
    <!-- Librarian top -->
    <circle cx="500" cy="162" r="14" fill="#0c1017" stroke="#4da3ff" stroke-width="2.2"/>
    <text x="500" y="138" text-anchor="middle" class="nlabel" fill="#e6eaf0">Librarian</text>
    <!-- Trader -->
    <circle cx="634" cy="234" r="26" fill="#0a3d31" filter="url(#soft)" opacity=".7"/>
    <circle cx="634" cy="234" r="15" fill="#0c1017" stroke="#00d1a0" stroke-width="2.4"/>
    <text x="662" y="230" class="nlabel" fill="#e6eaf0">Trader</text>
    <text x="662" y="245" class="nmetric">3 open · SUI +0.9</text>
    <!-- Strategist -->
    <circle cx="634" cy="390" r="14" fill="#0c1017" stroke="#4da3ff" stroke-width="2.2"/>
    <text x="662" y="386" class="nlabel" fill="#e6eaf0">Strategist</text>
    <text x="662" y="401" class="nmetric">27 / 24h</text>
    <!-- Theorist -->
    <circle cx="500" cy="462" r="14" fill="#0c1017" stroke="#525d6e" stroke-width="2.2"/>
    <text x="500" y="490" text-anchor="middle" class="nlabel" fill="#aab3c0">Theorist</text>
    <!-- Risk Officer (alert) -->
    <circle cx="366" cy="390" r="26" fill="#3d1420" filter="url(#soft)" opacity=".8"/>
    <circle cx="366" cy="390" r="15" fill="#160b0e" stroke="#ff5c74" stroke-width="2.4"/>
    <text x="338" y="386" text-anchor="end" class="nlabel" fill="#ffd9df">Risk Officer</text>
    <text x="338" y="401" text-anchor="end" class="nmetric" fill="#ff9aa9">guard armed</text>
    <!-- Researcher -->
    <circle cx="366" cy="234" r="14" fill="#0c1017" stroke="#4da3ff" stroke-width="2.2"/>
    <text x="338" y="230" text-anchor="end" class="nlabel" fill="#e6eaf0">Researcher</text>
    <text x="338" y="245" text-anchor="end" class="nmetric">16 / 24h</text>

    <!-- MANAGER core -->
    <circle cx="500" cy="312" r="60" fill="#00d1a0" filter="url(#soft)" opacity=".35"/>
    <circle cx="500" cy="312" r="46" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="500" cy="312" r="46" fill="none" stroke="#00ffc6" stroke-opacity=".5" stroke-width="1"/>
    <text x="500" y="308" text-anchor="middle" font-family="'Inter'" font-weight="800"
          font-size="15" fill="#04120e">MANAGER</text>
    <text x="500" y="326" text-anchor="middle" font-family="'JetBrains Mono'"
          font-size="10" fill="#0a2b22">eq $5,141</text>
  </svg>

  <div class="hud tl">
    <div class="kicker">the desk · live</div>
    <div class="h1">Agents</div>
    <div class="sub">one manager · a flat team of 13</div>
  </div>

  <div class="hud legend">
    <div class="row">active <span class="dot" style="background:#00d1a0"></span></div>
    <div class="row">idle <span class="dot" style="background:#4da3ff"></span></div>
    <div class="row">stale <span class="dot" style="background:#525d6e"></span></div>
    <div class="row">alert <span class="dot" style="background:#ff5c74"></span></div>
  </div>

  <div class="hud cap">
    <span class="pillchip"><span class="live"></span>nodes pulse on activity</span>
    <span style="color:var(--dimmer)">click a node → drill in</span>
  </div>
  <div class="hud drift">camera drifts slowly · scroll to zoom</div>
</div>
</x-dc>
</body>
</html>
