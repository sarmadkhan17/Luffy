# Trading OS configuration — all knobs live here.

mode:
  market: futures          # spot | futures — switchable from dashboard
  execution: paper         # paper | live (live requires explicit flag + keys)

universe:
  majors: [BTC/USDT, ETH/USDT, SOL/USDT]
  auto_scan:
    enabled: true
    top_n: 12              # alts filling remaining slots
    min_volume_usdt: 100000000
    min_price: 0.5
    min_age_days: 90       # skip fresh listings — insufficient history
    rescan_hours: 4
    blacklist:             # tokenized commodities / equities on USDT-M
      - XAU/USDT
      - XAG/USDT
      - CL/USDT
      - SOXL/USDT
      - SNDK/USDT
      - MU/USDT
      - SPCX/USDT
      - MSTR/USDT
      - CRCL/USDT

derivatives:
  enabled: true
  # OI / taker / long-short endpoints are capped at 500 rows AND hard-limited
  # to ~30 days of retention (measured 2026-08-31: 15m reaches 5d, 1h reaches
  # 20d, 4h and 1d both stop at 30d). Funding goes back years. So the recorder
  # runs from day one and history accumulates past the API window, and a
  # coarse backfill at boot makes ~30 days usable immediately.
  record_interval_minutes: 15
  backfill_on_start: true
  symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, SUI/USDT]
  request_delay_s: 0.3

timeframes:
  execution: 15m
  context: ["1h", "4h"]
  scan_interval_seconds: 60

risk:
  # 0.5 with 8 concurrent positions, not 1.5 with 4. Measured on Donchian
  # Breakout Trail over 1724 trades and 4.9 years, WITH the derisk ladder and
  # the halt breaker modelled: 1.5%/4 drives a 20% drawdown and trips
  # halt_drawdown_pct, stopping the system for good; 1.0%/4 and 1.0%/8 halt
  # too. 0.5%/8 survives at 12.8%/yr and a 15.3% peak drawdown, beating
  # 0.75%/4 (8.5%/yr, 17.7%) on BOTH return and risk, because a trend book
  # earns its Sharpe from breadth rather than from size per trade.
  # Total heat falls with the change: 8 x 0.5% = 4% against 4 x 1.5% = 6%.
  # A 37%-win-rate mechanism cannot be sized like a 50%-win-rate one.
  risk_per_trade_pct: 0.5
  proving_period_trades: 30      # first N live trades run at proving_size_mult
  proving_size_mult: 0.5
  portfolio_heat_cap_pct: 15.0   # max total open risk across positions
  per_symbol_risk_cap_pct: 8.0
  max_open_positions: 8          # breadth IS the risk control for a trend
                                 # book; see risk_per_trade_pct above
  max_daily_loss_pct: 6.0        # breaker blocks NEW entries until UTC midnight
  drawdown_derisk_steps:         # staged de-risk on rolling DD
    - {dd_pct: 8,  size_mult: 0.5}
    - {dd_pct: 12, size_mult: 0.25}
  halt_drawdown_pct: 20.0        # full stop → HALTED
  leverage: 5
  stop_loss_atr_mult: 2.5
  take_profit_atr_mult: 4.5
  trailing_atr_mult: 2.8
  # A stop bounds the loss only when it fills; a gap through it loses
  # notional. Sizing solved for distance-to-stop alone, so with the 0.4% stop
  # floor a $23 risk budget bought $5,750 of notional — a quarter of the
  # account in one position, and eight of those need margin that does not
  # exist. Positions are scaled down to fit these, not refused.
  max_position_margin_pct: 20.0   # margin one position may command
  max_total_margin_pct: 70.0      # margin all open positions may command
  min_notional_usdt: 10          # OUR entry-sizing floor, NOT the venue's
                                 # (UNI's MIN_NOTIONAL is 5) — do not conflate
  # Measured 2026-09-02 against 199 real fills and the venue's own
  # commissionRate endpoint: taker is 0.0400% on 14 of the 16 declared
  # symbols and 0.0500% on TAO and HYPE (maker 0.0200% throughout). All 199
  # fills settled commission in USDT, so no BNB discount is in effect.
  # NOTE this is the DEMO account; a production commissionRate call answers
  # -2015, so production fees are UNMEASURED and Binance's published VIP0
  # taker is 0.05%. Re-read commissionRate before setting BINANCE_DEMO=false.
  taker_fee_pct: 0.04
  # perp carry charged in the backtest per 8h held (was unmodelled entirely)
  funding_rate_8h: 0.0001
  # minutes per bar for the backtest's funding/hold accounting
  bar_minutes: 15            # cost model from day one (REQUIREMENTS §10)
  # Synthetic slippage as a fraction of ATR per fill. Because
  # `amount = risk / (2*ATR)`, ATR cancels and this is really a flat tax of
  # `2 * frac` on the risk staked, every symbol, every trade: 0.06 charged
  # 12% of risk per round trip. Measured 2026-09-02 the true cost is a
  # SPREAD, not an ATR multiple, and does not scale with volatility:
  #   * production book walk, 16 symbols x 4 snapshots: 0.42 bps half-spread,
  #     0.65 bps median cost to fill $1,200, worst symbol (NEAR) 2.69 bps
  #   * 56 real orders >= $1,000: 41 filled at a SINGLE price, median
  #     intra-order range 0.00 bps — no measurable impact term at this size
  # 0.06 charges 8.6-20.5 bps/fill where the book charges 0.4-2.7, an
  # overcharge of ~3-5x that was consuming ~75% of the mechanism's measured
  # per-trade edge. 0.015 is ~4 bps/fill at the median declared ATR — still
  # six times the measured cost, deliberately, because spreads widen during
  # the volatility expansion a breakout entry lands in and THAT is not
  # measured. Do not cut it further without measuring that.
  slippage_atr_frac: 0.015

mechanism:
  # The generate-judge-retire loop. No edge lasts, so this matters more than
  # any single strategy in the book.
  enabled: true
  interval_minutes: 720
  specs_per_cycle: 1
  max_specs: 8

research:                        # the search — docs/superpowers/specs/
                                 # 2026-09-11-luffy-research-pipeline-design.md
  enabled: true                  # measured 2026-09-13 (Task 15), reviewed, and
                                 # turned ON the same day. The thread is started
                                 # at boot only (kernel.py `_research_loop` is
                                 # spawned behind this flag), so flipping this
                                 # needs a kernel restart, and the loop then
                                 # sleeps 300s before its first step.
  # A horizon is searched only if its discovery universe can carry the test
  # AND its plain-window control is powered. consistency_p is a binomial
  # tail: at 8 symbols the 0.01 gate is unreachable even when every symbol
  # clears the no-edge median. All three horizons now carry 19/19 discovery
  # symbols (Task 1 deepened the store), so symbol count no longer decides
  # this — the control does. Measured 2026-09-13 on the incumbent's declared
  # 16, plain `ohlcv` window, trail geometry:
  #   4h  (100-bar / ~17d channel) p=2.4e-03 — POWERED, kept
  #   1h  (400-bar / ~17d channel) p=3.2e-01 — UNDERPOWERED, refused
  #   15m (1600-bar/ ~17d channel) p=2.4e-01 — UNDERPOWERED, refused
  # 1h and 15m are not merely thin on symbols any more; the known-good rule
  # itself cannot register on either at this channel length, so widening
  # the search to them would spend two cores on a question the gate cannot
  # answer. Re-measure with `--measure --tf <x>` and `--once --tf <x>`
  # before adding either back.
  horizons: ["4h"]
  min_discovery_symbols: 16
  geometries: ["trail", "fixed"]
  # Discovery ranks; it does not gate. 60 draws is 96% of the cost of an
  # evaluation (measured: 10.9s of 12.3s at 4h over 19 symbols), and the
  # gate that decides anything is phase 3's held-out look, which keeps 60.
  # Clamped at runtime to null_baseline.MIN_DRAWS (20) if set below it.
  discovery_null_draws: 30
  seed: 17
  batch_combos: 40
  batch_seconds: 900             # hard deadline for one child
  soft_margin_s: 60              # the child returns what it finished
  interval_seconds: 60
  nice: 19
  # Trade cycle p50 17.7s, p90 26.1s, p99 65.3s. Stand down for genuine
  # congestion, not for normal variation.
  skip_if_cycle_s: 45
  beam: 12                       # parents extended per level
  max_parts: 6                   # 1 trigger + 5 context
  grow_max_p: 0.25               # worth extending; NOT an admission bar
  control_max_p: 0.01            # a window has power if the incumbent reads this
  min_finite_frac: 0.5           # a gauge NaN over half the slice is not usable
  min_threshold_samples: 5000
  equity: 2000.0                 # the account the compounded return is walked on
  # ── the referee (phase 3) — docs/superpowers/plans/2026-09-14-research-phase3-referee.md
  # OFF pending a gate decision (2026-09-14, plan Task 9): the known-good
  # rule reads common-rotation p=0.049 on held-out B, so the referee as
  # built cannot admit the incumbent, and switching it on would spend the
  # LORD++ budget on looks that cannot succeed.
  referee: false                 # examine survivors on held-out A (unseen
                                 # markets) and B (the era after the cut)
  fdr_target: 0.10               # LORD++ target false-discovery rate
  lord_w0: 0.05                  # initial wealth; alpha_1 = 0.0025
  # the common-rotation p is exact and empirical, so its resolution is
  # 1/(draws+1). ~21 ms a draw at 4h over 19 symbols (measured 2026-09-14):
  # 19999 draws fit one child batch and resolve alpha down to 5e-5. A look
  # whose level is finer than that is DEFERRED, never tested at a level it
  # cannot reach.
  referee_max_draws: 19999
  referee_select_batch: 20       # survivors given entry sets per select step
  referee_max_attempts: 3        # a look that keeps crashing is charged p=1
  # CLOSED until phase 4 adds the reasoning test: the spec admits nothing
  # without a tested thesis. The kernel reads only `reason_passed`
  # candidates, and nothing in phase 3 writes that state.
  handoff: false

strategies:
  max_active: 6                  # concurrently active strategies
  # NOT IMPLEMENTED — nothing reads this key. TradingView confirmation is
  # ADVISORY and runs via Analyst.confirm_on_tv(); it never gates admission.
  # Left here so the intent is visible, but do not read it as a guarantee.
  tv_validation: true
  tv_interval: 1h
  tv_period: 1y
  tv_min_oos_trades: 5
  tv_require_positive_oos: true
  # A profit factor is a statement about arithmetic until it is compared
  # with something. TP 4.5 ATR over SL 2.5 ATR pays a coin flip 35.7% of the
  # time whatever the entry says, and ALWAYS-LONG scored PF 1.28 on real
  # candles purely on drift. gauntlet_null_draws rotations of the spec's own
  # signals give the null; the percentile it beats is the edge.
  gauntlet_null_draws: 60
  # 0.0 = measure and report only. Raise to gate (0.90 = beat 90% of its own
  # rotations). Nothing in the book currently clears 0.80.
  gauntlet_min_null_percentile: 0.0
  paper_probation_trades: 15     # trades a new strategy must pass in paper before live eligibility
  paper_min_winrate: 0.40
  paper_min_profit_factor: 1.15
  auto_demote_drawdown_pct: 8.0  # NOT IMPLEMENTED — retirement is decided by
                                 # decay_floor_pf below, not by drawdown
  # bars of 15m history each gauntlet backtest pulls (0 = everything cached).
  # Was hardcoded to 2900 (~30d). candles.db now holds ~20k bars (~209d), but
  # the backtester costs ~1.9 ms/bar/symbol, so a full 20k x 5-symbol run is
  # ~190s — longer than a brain tick can spend. 8000 (~83d) keeps a full
  # gauntlet near 75s while giving ~25d out-of-sample instead of the ~7d the
  # old 2900-bar window actually delivered. Raise for periodic deep runs.
  backtest_bars: 8000
  # symbols the internal gauntlet walks forward over
  backtest_symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "XRP/USDT", "SUI/USDT"]
  # ── selection: no edge lasts, so the gate asks "is this working NOW"
  # rather than "did this survive five years". A lifetime train/test split
  # averages the regimes an edge worked in with the ones it did not: under it
  # all 27 specs scored 0 passes, while 4 pass a 90-day pooled gate.
  select_recent_days: 90
  select_min_trades: 20
  # 90 days is 8,640 bars of 15m and 540 of 4h, so a fixed window asks a
  # different question of each timeframe: Donchian Breakout Trail produces 15
  # trades in 90d across 16 symbols and was refused for "only 15 trades",
  # while a 15m spec with the same edge per bar clears easily. The window
  # doubles until it holds select_min_trades, and stops here. Retirement
  # never widens — see rolling.has_decayed.
  select_max_days: 365
  select_min_pf: 1.15
  # A profit factor is a statement about arithmetic: exit geometry sets a win
  # rate by itself, and ALWAYS-LONG scores PF 1.28 on drift alone. So a spec
  # must also beat a circular rotation of its OWN entries, consistently,
  # across independent symbols. Under no edge those per-symbol percentiles
  # are uniform, so this is a binomial tail probability, not a fitted cut —
  # measured false-positive rate 0.1-0.4%. Donchian sits at 3.5e-04; a screen
  # candidate that died out of sample sat at 0.27. Fewer than 4 symbols
  # carrying a percentile is silence, and silence does not block admission.
  select_null_max_p: 0.01
  # ── retirement: shorter and more lenient than selection, because holding a
  # dead strategy costs continuously while retiring a live one costs a retest.
  # Too few trades is IDLE, not decayed — a setup waiting for its regime.
  decay_recent_days: 30
  decay_min_trades: 10
  decay_floor_pf: 0.85
  # ── persistence: context only, never a gate. How often this mechanism has
  # paid historically, which informs how closely to watch it.
  persistence_window_days: 60
  persistence_step_days: 15
  # ── regime fitness: spec.regime_filter as written is the author's guess,
  # and the orchestrator gates live signals on it. These measure it instead.
  # Windows are ~a month because a regime label does not hold for longer.
  regime_window_days: 30
  regime_step_days: 7
  regime_min_windows: 5
  regime_min_hit_rate: 0.5
  regime_min_median_pf: 1.0
  # binding cheap gate on the internal walk-forward
  gauntlet_min_test_pf: 1.15
  gauntlet_min_test_trades: 20
  # bars used by the cheap single-symbol prescreen before the full run
  prescreen_bars: 3000
  # wall-clock ceiling for one propose() sweep (it runs inside the brain
  # tick). <= 0 disables the sweep.
  gauntlet_time_budget_s: 300
  # how many prescreen survivors earn a full multi-symbol walk-forward
  gauntlet_max_full_runs: 2  # statistical instant demotion, no LLM needed

tv_harness:
  enabled: true                  # REAL Strategy Tester via browser automation
  daily_runs: 2                  # hard budget; folds consume runs too
  budget_enabled: true           # DEV PHASE: unlimited tester runs until finalization
  run_timeout_s: 90

harvester:                     # numbers: series acquisition + coverage brief
  enabled: true
  request_delay_s: 0.3
  # symbols default to derivatives.symbols
  # Binance retains oi/taker_ratio/ls_ratio ~30 days while the backtest frame
  # spans ~83, so those three can never clear the 90% coverage gate from
  # Binance alone. Coinalyze serves them far deeper; set COINALYZE_API_KEY in
  # .env (free signup) to switch them on. funding and basis need no key.
  coinalyze:
    enabled: true              # no-op without COINALYZE_API_KEY
    history_years: 2.0
    # Coinalyze's enum, NOT our timeframe name — "4h" answers 400 and a 400
    # degrades to an empty frame, which reads as "no history". Retention is a
    # ~2000-bar rolling buffer per interval, measured 2026-09-03:
    #   1hour 84d | 4hour 334d | 12hour 1000d | daily 2190d
    # so 4hour gives 334 days, against a 75-day coverage floor. Deeper is not
    # available at any interval we trade. Funding is deliberately NOT fetched
    # here; Binance serves it natively over 4-5 years.
    interval: 4hour

mcp:                           # MCP servers the KERNEL may call at runtime
  servers:                     # (.mcp.json configures the coding agent's own)
    coingecko:
      enabled: true
      url: https://mcp.api.coingecko.com/mcp

scraper:                       # ideas: TradingView + RSS + deep crawl
  enabled: true
  interval_minutes: 240        # scrape + extract + test every 4h
  ideas_per_cycle: 4           # token budget per cycle (batched into ONE LLM call)
  tv_pages: 2                  # TradingView scripts pages per tag
  tv_tags: ["meanreversion", "momentum", "volatility", "trendanalysis",
            "bitcoin", "ethereum"]
  rss_feeds:                   # news wires + quant essays + papers + forums
    - https://cointelegraph.com/rss
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://decrypt.co/feed
    - https://newsbtc.com/feed/
    - https://www.cryptopotato.com/feed/
    - https://medium.com/feed/tag/algorithmic-trading
    - https://dev.to/feed/tag/trading
    - http://arxiv.org/rss/q-fin.TR     # quant trading preprints
    - http://arxiv.org/rss/q-fin.PM     # portfolio management preprints
    - https://www.reddit.com/r/algotrading/.rss
    - https://quantocracy.com/feed/     # quant blog aggregator (best-of)
    - https://alphaarchitect.com/feed/  # evidence-based factor research
    - https://robotwealth.com/feed/
    - https://financial-hacker.com/feed/
    - https://rektcapital.substack.com/feed  # crypto cycle analysis
    - https://habr.com/en/rss/best/daily/?fl=ru

scouts:
  # A trade needs a strategy that says so. Measured on 204 live decisions
  # (2026-08-24..09-02): at the 4h horizon the blended analyst+strategy score
  # returned -0.695% a call, won 34.6%, t=-3.84 — and BOTH sides lost there
  # (BUY -0.335%, SELL -1.117%), which market drift cannot produce. Analysts
  # now choose among what a validated mechanism proposed rather than opening
  # positions on their own. Vetoed leans are still graded, so reopening this
  # is an evidence decision. Set false to restore the old blend.
  require_strategy_signal: true
  # ...and once it has, the analysts stop setting the score. Live on
  # 2026-09-02: UNI HOLD score=+0.2454 thr=0.2629 with Donchian Breakout
  # Trail signalling BUY at 0.60 confidence — the one mechanism with
  # measured edge, held under threshold by seven without. A lone signal can
  # reach at most 0.6*0.45/1.45 = 0.186 in the blend, under every threshold
  # the system produces. Analysts are still evaluated and journalled, so
  # their skill stays measurable and this stays reversible.
  strategy_leads: true
  htf_soft_bump: 0.07          # extra threshold when entering against a strong 4h trend
  htf_hard_veto: 0.80          # |4h trend score| beyond this refuses counter-trend entries
  news_guard:
    enabled: true
    window_hours: 3            # impact headline age that keeps the blackout armed
    min_headlines: 2           # count needed to arm (1 if severe: hack/depeg/FOMC...)
    refresh_minutes: 10
  macro_guard:
    enabled: true
    pre_event_min: 30        # freeze N minutes before scheduled event
    post_event_min: 120      # stay frozen N minutes after event
    min_impact: "high"       # only "high" impact US events
    # Calendar source: the free ForexFactory JSON feed (no key). A Finnhub
    # key is tried first if set, but that endpoint needs a paid plan.
    # finnhub_token: ""      # set FINNHUB_API_KEY in .env instead
  calibration:
    enabled: true              # learned conviction from journal outcomes
    min_samples: 60            # below this, votes pass through untouched
    refit_hours: 6
  ewa:                         # online expert weights (Phase 1)
    enabled: true
    eta: 0.30                  # per-wrong-call weight decay
    prior: 30                  # pseudo-count shrinkage toward static weights
  meta:                        # secondary trust/sizing model (Phase 1)
    enabled: true              # live w/ bounds: veto p<0.45, size 0.25-1.0x
  adaptive_threshold:          # per-regime hit-rate thresholds (Phase 1)
    enabled: true
    min_outcomes: 30           # per regime before adapting

crawler:
  enabled: true
  interval_minutes: 360        # deep-read walk every 6h
  max_pages_per_cycle: 25
  max_depth: 2                 # links followed from seeds / rss items
  passages_per_mine: 10        # token budget: top-scored passages per cycle
  passages_per_queue: 40       # passages handed to the Strategist's idea
                               # queue — wider than the mine budget:
                               # expressing an idea costs one prompt,
                               # mining it costs a batch
  per_host_delay_s: 1.5
  seeds:
    - https://chartschool.stockcharts.com/table-of-contents/market-indicators
    - https://en.wikipedia.org/wiki/Mean_reversion_(finance)
    - https://en.wikipedia.org/wiki/Momentum_(finance)
    - https://en.wikipedia.org/wiki/Pair_trade
    - https://en.wikipedia.org/wiki/Moving_average_crossover
    - https://en.wikipedia.org/wiki/Relative_strength_index
    - https://towardsdatascience.com/
    - https://oxfordstrat.com/category/ideas/     # strategy idea essays
    - https://quantpedia.com/Strategies/          # strategy encyclopedia (free tier)
    - https://www.tradingview.com/scripts/?script_type=strategies  # pine strategies w/ logic descriptions
    - https://www.federalreserve.gov/econres/feds/index.htm  # Fed working papers
    - https://www.bis.org/list/wpapers/index.htm  # BIS working papers

brain:
  provider: deepseek
  base_url: https://api.deepseek.com   # OpenAI-compatible; swap for Ollama/OpenRouter later
  model_fast: deepseek-chat            # V3 — proposals, summaries
  model_deep: deepseek-reasoner        # R1 — autopsies, strategy verdicts
  evolution_interval_minutes: 120      # NOT IMPLEMENTED — vestigial; the
                                       # generate/retire loop is mechanism.*
  daily_token_budget: 200000
  # Reserved daily slices (tokens). A listed purpose spends only its own
  # slice; unlisted purposes (strategist, tv, legacy_review, misc) share what
  # is left of daily_token_budget. `research` is held for the research
  # pipeline's Reason step so no other consumer can starve it.
  purpose_budgets:
    research: 120000
    chat: 30000
  max_tokens_per_call: 4000
  # deepseek-reasoner spends max_tokens on chain-of-thought FIRST; if the cap
  # is hit while still reasoning it returns empty content. Deep calls need
  # room for reasoning + answer (autopsy measured at ~12.4k completion tokens).
  max_tokens_deep: 16000

references:                     # reference markets for ref(key, expr) — trader/data/references.py
  enabled: true
  interval_minutes: 60          # Yahoo, BTCDOM, stables and the alt index; CoinGecko snapshots every 4h
  # the alt index: the 36 crypto perps the mechanism screens use, minus BTC
  alts_members: [ETH/USDT, SOL/USDT, XRP/USDT, BNB/USDT, DOGE/USDT, ADA/USDT,
                 LINK/USDT, AVAX/USDT, LTC/USDT, 1000PEPE/USDT, APT/USDT,
                 BCH/USDT, DASH/USDT, FET/USDT, INJ/USDT, T/USDT, WLD/USDT,
                 XMR/USDT, UNI/USDT, SUI/USDT, TAO/USDT, ZEC/USDT, NEAR/USDT,
                 FIL/USDT, AAVE/USDT, HYPE/USDT, TRUMP/USDT, 1000SHIB/USDT,
                 ARB/USDT, CRV/USDT, DOT/USDT, ICP/USDT, OP/USDT, TRX/USDT,
                 XLM/USDT]

dashboard:
  host: 192.168.126.131
  port: 8080

notify:
  telegram: true
  alert_on_trade: true           # NOT IMPLEMENTED — trade alerts are
                                 # unconditional (kernel sends on every entry)
  daily_digest_hour_utc: 20      # NOT IMPLEMENTED — no digest job exists

rent:                            # Luffy pays rent. See
                                 # docs/superpowers/specs/2026-09-11-luffy-pays-rent-design.md
  weekly_usdt: 50                # net trading income per Monday-to-Monday UTC week
  first_week_start: "2026-09-14" # earlier weeks get a tally, never a verdict
  check_minutes: 60              # tally refresh; the verdict lands on the first
                                 # check after Monday 00:00 UTC

logging:
  level: INFO

# Forward-only shadow diagnostics; no influence on trading decisions.
# Enable during a coordinated demo rollout of kernel AND dashboard.
attention:
  enabled: true
  timeframe: 4h
  max_symbols: 16               # subset cap, not venue-wide coverage
  max_causes: 64                # evaluator receipts per symbol
  queue_size: 16
  timeout_seconds: 10
  stale_seconds: 300
  max_scans: 512
  max_age_seconds: 604800       # seven days; pruned on writes
  max_bytes: 67108864           # SQLite main-file ceiling; journal needs headroom

# Forward shadow forecasts only; independent watchdog consumer, never admission.
attention_learning:
  enabled: true
