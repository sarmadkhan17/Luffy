# Trading OS configuration — all knobs live here.

mode:
  market: futures          # spot | futures — switchable from dashboard
  execution: paper         # paper | live (live requires explicit flag + keys)

universe:
  majors: [BTC/USDT, ETH/USDT, SOL/USDT]
  auto_scan:
    enabled: true
    top_n: 12              # alts filling remaining slots
    min_volume_usdt: 100000000
    min_price: 0.5
    min_age_days: 90       # skip fresh listings — insufficient history
    rescan_hours: 4
    blacklist:             # tokenized commodities / equities on USDT-M
      - XAU/USDT
      - XAG/USDT
      - CL/USDT
      - SOXL/USDT
      - SNDK/USDT
      - MU/USDT
      - SPCX/USDT
      - MSTR/USDT
      - CRCL/USDT

timeframes:
  execution: 15m
  context: ["1h", "4h"]
  scan_interval_seconds: 60

risk:
  risk_per_trade_pct: 5.0        # moderate envelope (REQUIREMENTS §10)
  proving_period_trades: 30      # first N live trades run at proving_size_mult
  proving_size_mult: 0.5
  portfolio_heat_cap_pct: 15.0   # max total open risk across positions
  per_symbol_risk_cap_pct: 8.0
  max_open_positions: 10
  max_daily_loss_pct: 6.0        # breaker blocks NEW entries until UTC midnight
  drawdown_derisk_steps:         # staged de-risk on rolling DD
    - {dd_pct: 8,  size_mult: 0.5}
    - {dd_pct: 12, size_mult: 0.25}
  halt_drawdown_pct: 20.0        # full stop → HALTED
  leverage: 5
  stop_loss_atr_mult: 2.5
  take_profit_atr_mult: 4.5
  trailing_atr_mult: 2.8
  min_notional_usdt: 10
  taker_fee_pct: 0.05            # cost model from day one (REQUIREMENTS §10)
  slippage_atr_frac: 0.06        # synthetic slippage = frac of ATR per fill

strategies:
  max_active: 6                  # concurrently active strategies
  tv_validation: true            # TradingView walk-forward is mandatory judge
  tv_interval: 1h
  tv_period: 1y
  tv_min_oos_trades: 5
  tv_require_positive_oos: true
  paper_probation_trades: 15     # trades a new strategy must pass in paper before live eligibility
  paper_min_winrate: 0.40
  paper_min_profit_factor: 1.15
  auto_demote_drawdown_pct: 8.0  # statistical instant demotion, no LLM needed

harvester:
  enabled: true
  interval_minutes: 240        # scrape + extract + test every 4h
  ideas_per_cycle: 12          # token budget per cycle (batched into ONE LLM call)
  tv_pages: 2                  # TradingView ideas pages per tag
  tv_tags: [btcusdt, ethusdt, solusdt, altcoin, scalping, breakout, trend-trading]
  rss_feeds:                   # news wires + quant essays + papers + forums
    - https://cointelegraph.com/rss
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://decrypt.co/feed
    - https://newsbtc.com/feed/
    - https://www.cryptopotato.com/feed/
    - https://medium.com/feed/tag/algorithmic-trading
    - https://dev.to/feed/tag/trading
    - http://arxiv.org/rss/q-fin.TR     # quant trading preprints
    - http://arxiv.org/rss/q-fin.PM     # portfolio management preprints
    - https://www.reddit.com/r/algotrading/.rss
    - https://quantocracy.com/feed/     # quant blog aggregator (best-of)
    - https://alphaarchitect.com/feed/  # evidence-based factor research
    - https://robotwealth.com/feed/
    - https://financial-hacker.com/feed/
    - https://rektcapital.substack.com/feed  # crypto cycle analysis
    - https://habr.com/en/rss/best/daily/?fl=ru

scouts:
  htf_soft_bump: 0.07          # extra threshold when entering against a strong 4h trend
  htf_hard_veto: 0.80          # |4h trend score| beyond this refuses counter-trend entries
  news_guard:
    enabled: true
    window_hours: 3            # impact headline age that keeps the blackout armed
    min_headlines: 2           # count needed to arm (1 if severe: hack/depeg/FOMC...)
    refresh_minutes: 10
  calibration:
    enabled: true              # learned conviction from journal outcomes
    min_samples: 60            # below this, votes pass through untouched
    refit_hours: 6

crawler:
  enabled: true
  interval_minutes: 360        # deep-read walk every 6h
  max_pages_per_cycle: 25
  max_depth: 2                 # links followed from seeds / rss items
  passages_per_mine: 10        # token budget: top-scored passages per cycle
  per_host_delay_s: 1.5
  seeds:
    - https://chartschool.stockcharts.com/table-of-contents/market-indicators
    - https://en.wikipedia.org/wiki/Mean_reversion_(finance)
    - https://en.wikipedia.org/wiki/Momentum_(finance)
    - https://en.wikipedia.org/wiki/Pair_trade
    - https://en.wikipedia.org/wiki/Moving_average_crossover
    - https://en.wikipedia.org/wiki/Relative_strength_index
    - https://towardsdatascience.com/
    - https://oxfordstrat.com/category/ideas/     # strategy idea essays
    - https://quantpedia.com/Strategies/          # strategy encyclopedia (free tier)
    - https://www.tradingview.com/scripts/?script_type=strategies  # pine strategies w/ logic descriptions
    - https://www.federalreserve.gov/econres/feds/index.htm  # Fed working papers
    - https://www.bis.org/list/wpapers/index.htm  # BIS working papers

brain:
  provider: deepseek
  model_fast: deepseek-chat            # V3 — proposals, summaries
  model_deep: deepseek-reasoner        # R1 — autopsies, strategy verdicts
  evolution_interval_minutes: 120      # continuous evolution heartbeat
  daily_token_budget: 200000
  max_tokens_per_call: 4000

dashboard:
  host: 0.0.0.0
  port: 8080

notify:
  telegram: true
  alert_on_trade: true
  daily_digest_hour_utc: 20

logging:
  level: INFO
