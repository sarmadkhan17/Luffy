# org.yaml — Luffy's company directory.
#
# One Manager over a flat team of employees; each employee does one job and
# wraps existing code. This file is the SOURCE OF TRUTH for the org chart and
# the knowledge-graph role nodes. Adding an employee = add a block below
# (no code change). Analysts are appended automatically at load time — one per
# Analyst subclass in trader/agents/ — so the roster never drifts from the code.
#
# Fields:
#   name        human-readable node name (becomes the [[wikilink]] in the vault)
#   title       job title
#   reports_to  manager's name (metadata only — never changes decision logic)
#   wraps       dotted module paths this employee is responsible for
#   authors     note types this employee signs (see trader/knowledge/vault.py)
#   desc        one-line description

manager:
  name: Manager
  title: Manager
  wraps: [trader.kernel, trader.engine.orchestrator, trader.brain.judge]
  authors: [daily-review]
  status_source: manager
  category: BRAIN
  desc: Coordinates the team, makes the final call, keeps the books.

employees:
  - name: Scraper
    title: Scraper
    reports_to: Manager
    wraps: [trader.brain.scraper, trader.brain.crawler, trader.brain.ideas]
    authors: []
    status_source: events
    events: [harvest_cycle, harvest_accepted, crawl_cycle, crawl_doc]
    category: RESEARCH
    desc: Reads prose — idea feeds, essays, papers — and queues mechanisms.

  - name: Harvester
    title: Harvester
    reports_to: Manager
    wraps: [trader.brain.harvester, trader.data.derivatives,
            trader.data.mcp_client]
    authors: []
    status_source: events
    events: [harvest_numeric]
    category: RESEARCH
    desc: Reads numbers — venue APIs and MCP servers — and reports coverage.

  - name: Strategist
    title: Strategist
    reports_to: Manager
    wraps: [trader.brain.strategist, trader.brain.spec_writer]
    authors: [strategy]
    status_source: events
    events: [review_complete, proposal_accepted, retire, mutate, keep_verdict]
    category: RESEARCH
    desc: Reviews the strategy book; promotes and demotes.

  - name: Strategy Analyst
    title: Strategy Analyst
    reports_to: Manager
    wraps: [trader.brain.analyst, trader.strategy.spec_evidence,
            trader.strategy.pine_spec]
    authors: []
    status_source: events
    events: [spec_admitted, spec_rejected, tv_backtest]
    category: RESEARCH
    desc: Tests specs on stored data and TradingView; ranks them by regime fit.

  - name: Theorist
    title: Theorist
    reports_to: Manager
    wraps: [trader.brain.theorist]
    authors: [postmortem]
    status_source: events
    events: [autopsy, doctrine_updated, doctrine_created]
    category: RESEARCH
    desc: Autopsies losing clusters and edge decay into doctrine.

  - name: Risk Officer
    title: Risk Officer
    reports_to: Manager
    wraps: [trader.engine.risk, trader.agents.macro_guard, trader.agents.news_guard]
    authors: []
    status_source: risk
    category: RISK
    desc: Sizing, heat cap, daily breaker, macro/news event freezes.

  - name: Trader
    title: Trader
    reports_to: Manager
    wraps: [trader.engine.executor, trader.engine.exits]
    authors: []
    status_source: trader
    category: EXECUTION
    desc: Executes entries; manages trailing stops and time exits.

  - name: Librarian
    title: Librarian
    reports_to: Manager
    wraps: [trader.knowledge.vault]
    authors: [theory, moc]
    status_source: librarian
    category: KNOWLEDGE
    desc: Keeps the knowledge vault and the map of content current.
